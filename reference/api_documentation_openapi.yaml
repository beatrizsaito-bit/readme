openapi: 3.0.3
info:
  title: Data Distributor API
  version: 1.0.2
  description: API de distribuição de dados Open Finance Brasil.
servers:
  - url: '{{base_url}}/api/v1'
    description: Base URL configurável por ambiente
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WebhookEventPayload:
      type: object
      description: Estrutura enviada ao endpoint do cliente em todo evento webhook.
      properties:
        id:
          type: string
          description: ID único do evento. Use para idempotência.
        eventType:
          type: string
          enum:
            - account.balance.updated
            - account.transactions.updated
            - consent.created
            - consent.confirmed
            - consent.rejected
            - consent.revoked
            - user.data.insert.start
            - user.data.insert.finish
        created:
          type: integer
          format: int64
          description: Unix timestamp (segundos)
        tenantId:
          type: string
        apiVersion:
          type: string
          example: '2025-02-01'
        data:
          type: object
          properties:
            userId:
              type: string
            object:
              type: object
              description: Estado atual do recurso
            previousAttributes:
              type: object
              description: Campos alterados — estado anterior
      x-webhook-signature:
        header: X-Lina-Signature
        format: t={unix_timestamp},v1={hmac_hex}
        algorithm: HMAC-SHA256
        message: '{t}.{raw_body}'
        tolerance_seconds: 300
paths:
  /organisations:
    get:
      tags:
        - Realizando um Consentimento
      summary: 1.1 - Listagem de participantes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
      description: Sem campos de resposta documentados.
  /consents:
    post:
      tags:
        - Realizando um Consentimento
      summary: 1.2 - Criação de consentimento
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
      description: Sem campos de resposta documentados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organisationId:
                  type: string
                authorisationServerId:
                  type: string
                consent:
                  type: object
                  properties:
                    loggedUser:
                      type: object
                      properties:
                        cpf:
                          type: string
                    permissions:
                      type: array
                      items: {}
              required:
                - authorisationServerId
                - consent
                - organisationId
    get:
      tags:
        - Consentimentos
      summary: Lista Consentimentos Detalhes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
      description: Sem campos de resposta documentados.
  /consents/callback:
    post:
      tags:
        - Realizando um Consentimento
      summary: 1.3 - Validar Callback
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  authorisationServerId:
                    type: string
                  organisationId:
                    type: string
                  consentId:
                    type: string
      description: ℹ️ Campos extraídos do exemplo de resposta da collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                code:
                  type: string
                idToken:
                  type: string
              required:
                - code
                - idToken
                - state
  /users/{user_id}/consents/{id}:
    delete:
      tags:
        - Consentimentos
      summary: Revogação de consentimento
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sem conteúdo
      description: Sem campos de resposta documentados.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
  /users/{user_id}/consents:
    get:
      tags:
        - Consentimentos
      summary: Lista de consentimentos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        _id:
                          type: string
                        userId:
                          type: string
                        consentId:
                          type: string
                        creationDateTime:
                          type: string
                        status:
                          type: string
                        statusUpdateDateTime:
                          type: string
                        permissions:
                          type: array
                          items: {}
                        organisationId:
                          type: string
                        authorisationServerId:
                          type: string
                        version:
                          type: integer
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        tenantId:
                          type: string
                        rejection:
                          type: object
                          properties:
                            rejectedBy:
                              type: string
                            reason:
                              type: object
                              properties:
                                code:
                                  type: string
                        convertedStatusUpdateTime:
                          type: string
      description: ℹ️ Campos extraídos do exemplo de resposta da collection.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
  /users/{user_id}/consents/{consent_id}:
    get:
      tags:
        - Consentimentos
      summary: Recuperar um consentimento
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
      description: Sem campos de resposta documentados.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: consent_id
          in: path
          required: true
          schema:
            type: string
  /users/{user_id}:
    get:
      tags:
        - Usuários
      summary: Usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
      description: Sem campos de resposta documentados.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
  /users:
    get:
      tags:
        - Usuários
      summary: Usuário por tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        cpf:
                          type: string
                        banks:
                          type: array
                          items:
                            properties:
                              authorisationServerId:
                                type: string
                              organisationId:
                                type: string
                        cnpj:
                          type: string
                          nullable: true
                        updatedAt:
                          type: string
                        userId:
                          type: string
                  page:
                    type: integer
                  limit:
                    type: integer
      description: ℹ️ Campos extraídos do exemplo de resposta da collection.
  /notification/{tenant_id}:
    get:
      tags:
        - Notification Channels
      summary: Buscar Canais
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId:
                    type: string
                    description: Identificador do tenant
                  channels:
                    type: array
                    items:
                      properties:
                        type:
                          type: string
                          description: 'Tipo do canal: slack, email, sms'
                        value:
                          type: string
                          description: URL do webhook (Slack) ou endereço (email/sms)
                        enable:
                          type: boolean
                          description: true se o canal está ativo
                    description: Lista de canais configurados
                  createdAt:
                    type: string
                    format: date
                    description: Data de criação do registro
                  updatedAt:
                    type: string
                    format: date
                    description: Data da última atualização
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
    patch:
      tags:
        - Notification Channels
      summary: Atualizar Canais
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  type: array
                  items:
                    properties:
                      type:
                        type: string
                        description: slack, email ou sms
                      value:
                        type: string
                        description: Nova URL ou endereço
                      enable:
                        type: boolean
                        description: true para ativar
                  description: Lista de canais a atualizar
              required:
                - channels
  /notification:
    post:
      tags:
        - Notification Channels
      summary: Criar Canais
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                  description: Identificador do tenant
                channels:
                  type: array
                  items:
                    properties:
                      type:
                        type: string
                        description: slack, email ou sms
                      value:
                        type: string
                        description: URL (Slack) ou endereço (email/sms)
                      enable:
                        type: boolean
                        description: true para ativar o canal
                  description: Lista de canais a configurar
              required:
                - channels
                - tenantId
  /notification/{tenant_id}/webhooks:
    get:
      tags:
        - Configuração de Webhook
      summary: Listar Webhooks do Tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      properties:
                        clientId:
                          type: string
                          description: Client ID Keycloak associado
                        value:
                          type: string
                          description: URL do endpoint que receberá os eventos
                        enable:
                          type: boolean
                          description: true se o webhook está ativo
                        secret:
                          type: string
                          description: Secret para verificar a assinatura X-Lina-Signature
                        consecutiveFailures:
                          type: number
                          description: >-
                            Quantidade de eventos consecutivos que falharam
                            todas as tentativas
                        previousSecret:
                          type: string
                          description: (após rotação) Secret anterior, válido por 24h
                        previousSecretExpiresAt:
                          type: string
                          format: date
                          description: (após rotação) Quando o secret anterior expira
                        disabledAt:
                          type: string
                          format: date
                          description: >-
                            (se desabilitado) Quando foi desabilitado
                            automaticamente
                        disabledReason:
                          type: string
                          description: (se desabilitado) Motivo da desabilitação
                    description: Lista de webhooks configurados
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
  /notification/{tenant_id}/webhooks/{client_id}:
    put:
      tags:
        - Configuração de Webhook
      summary: Criar ou Atualizar Webhook
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
      description: Se o webhook para o clientid não existir, cria. Se existir, atualiza.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
        - name: client_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: URL HTTPS do endpoint de destino
                enable:
                  type: boolean
                  description: true para ativar o webhook
                secret:
                  type: string
                  description: Se omitido, é gerado automaticamente
              required:
                - enable
                - value
    delete:
      tags:
        - Configuração de Webhook
      summary: Remover Webhook
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sem conteúdo
      description: Eventos futuros não serão mais entregues para esse clientid.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
        - name: client_id
          in: path
          required: true
          schema:
            type: string
  /notification/{tenant_id}/webhooks/{client_id}/rotate-secret:
    post:
      tags:
        - Configuração de Webhook
      summary: Rotacionar Secret
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: >-
                      Novo secret gerado. Guarde imediatamente — não será
                      exibido novamente.
      description: >-
        Gera um novo secret. O secret anterior permanece válido por 24 horas
        para migração sem downtime. Durante esse período, o header
        X-Lina-Signature terá dois valores v1 — aceite o evento se qualquer um
        for válido.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
        - name: client_id
          in: path
          required: true
          schema:
            type: string
  /webhook-events:
    get:
      tags:
        - Eventos do Webhook
      summary: Listar Eventos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        _id:
                          type: string
                          description: ID único do evento (evt_...)
                        type:
                          type: string
                          description: Tipo do evento
                        tenantId:
                          type: string
                          description: Identificador do tenant
                        clientId:
                          type: string
                          description: Client ID Keycloak do webhook de destino
                        created:
                          type: number
                          description: Unix timestamp de criação (segundos)
                        apiVersion:
                          type: string
                          description: 'Versão da API (ex: 2025-02-01)'
                        status:
                          type: string
                          description: pending · delivered · failed · endpoint_disabled
                        endpoint:
                          type: string
                          description: URL para a qual o evento foi enviado
                        attempts:
                          type: array
                          items:
                            properties:
                              number:
                                type: number
                                description: Número da tentativa
                              at:
                                type: string
                                format: date
                                description: Data/hora da tentativa
                              statusCode:
                                type: number
                                description: HTTP status recebido
                              responseBody:
                                type: string
                                description: Corpo da resposta recebida
                              durationMs:
                                type: number
                                description: Duração da chamada em milissegundos
                          description: Histórico de tentativas de entrega
                        nextRetryAt:
                          type: string
                          format: date
                          description: >-
                            Quando será feita a próxima tentativa (null se não
                            aplicável)
                        createdAt:
                          type: string
                          format: date
                          description: Data/hora de criação do registro
                        updatedAt:
                          type: string
                          format: date
                          description: Data/hora da última atualização
                        expiresAt:
                          type: string
                          format: date
                          description: Data/hora de expiração do evento (30 dias)
                    description: Lista de eventos
                  meta:
                    type: object
                    properties:
                      total:
                        type: number
                        description: Total de eventos
                      page:
                        type: number
                        description: Página atual
                      limit:
                        type: number
                        description: Itens por página
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
          description: >-
            Filtrar por tipo: account.balance.updated,
            account.transactions.updated, consent.created, consent.confirmed,
            consent.rejected, consent.revoked, user.data.insert.start,
            user.data.insert.finish
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: pending, delivered, failed, endpoint_disabled
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Data de início
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Data de fim
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: 'Página (default: 1)'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: 'Itens por página, máx 100 (default: 25)'
  /webhook-events/{event_id}:
    get:
      tags:
        - Eventos do Webhook
      summary: Buscar Evento
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      payload:
                        type: string
                        description: Payload original do evento (JSON serializado)
      description: >-
        Retorna detalhes completos do evento, incluindo payload original e
        histórico de tentativas.
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
  /webhook-events/{event_id}/retry:
    post:
      tags:
        - Eventos do Webhook
      summary: Reenviar Evento
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Resposta 202
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: '"Event queued for retry"'
                  eventId:
                    type: string
                    description: ID do evento reenfileirado
      description: >-
        Reenvia o evento para o endpoint configurado. Não é possível fazer retry
        de eventos com status delivered.
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
  /users/{user_id}/accounts:
    get:
      tags:
        - Contas
      summary: Listagem de contas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accountId:
                        type: string
                        description: Identifica de forma única a conta do cliente.
                      brandName:
                        type: string
                        description: >-
                          Nome da Marca reportada pelo participante no Open
                          Finance.
                      companyCnpj:
                        type: string
                        description: CNPJ completo da instituição responsável.
                      type:
                        type: string
                        description: Tipo de conta.
                        enum:
                          - CONTA_DEPOSITO_A_VISTA
                          - CONTA_POUPANCA
                          - CONTA_PAGAMENTO_PRE_PAGA
                      compeCode:
                        type: string
                        description: Código BCB da instituição (STR).
                      branchCode:
                        type: string
                        description: >-
                          Código da Agência detentora da conta. — Obrigatório
                          quando type != CONTA_PAGAMENTO_PRE_PAGA (condicional)
                      number:
                        type: string
                        description: Número da conta.
                      checkDigit:
                        type: string
                        description: Dígito da conta.
                      subtype:
                        type: string
                        description: Subtipo de conta.
                        enum:
                          - INDIVIDUAL
                          - CONJUNTA_SIMPLES
                          - CONJUNTA_SOLIDARIA
                      currency:
                        type: string
                        description: Moeda da conta, ISO-4217.
      description: '📌 Fonte OFB: Contas'
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
  /users/{user_id}/accounts/{account_id}/transactions:
    get:
      tags:
        - Contas
      summary: Transações de conta
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transactionId:
                        type: string
                        description: Código ou identificador único da transação.
                      completedAuthorisedPaymentType:
                        type: string
                        description: >-
                          Indicador da transação: efetivada, lançamento futuro
                          ou processando.
                        enum:
                          - TRANSACAO_EFETIVADA
                          - LANCAMENTO_FUTURO
                          - TRANSACAO_PROCESSANDO
                      creditDebitType:
                        type: string
                        description: 'Indicador do tipo de lançamento: Débito ou Crédito.'
                        enum:
                          - CREDITO
                          - DEBITO
                      transactionName:
                        type: string
                        description: >-
                          Literal usada na instituição para identificar a
                          transação.
                      type:
                        type: string
                        description: Classifica a transação em um dos tipos descritos.
                        enum:
                          - TED
                          - DOC
                          - PIX
                          - TRANSFERENCIA_MESMA_INSTITUICAO
                          - BOLETO
                          - CONVENIO_ARRECADACAO
                          - PACOTE_TARIFA_SERVICOS
                          - TARIFA_SERVICOS_AVULSOS
                          - FOLHA_PAGAMENTO
                          - DEPOSITO
                          - SAQUE
                          - CARTAO
                          - ENCARGOS_JUROS_CHEQUE_ESPECIAL
                          - RENDIMENTO_APLIC_FINANCEIRA
                          - PORTABILIDADE_SALARIO
                          - RESGATE_APLIC_FINANCEIRA
                          - OPERACAO_CREDITO
                          - OUTROS
                      transactionAmount:
                        type: object
                        description: Valor da transação.
                        properties:
                          amount:
                            type: string
                            description: Valor monetário da transação.
                          currency:
                            type: string
                            description: Moeda da transação, ISO-4217.
                      transactionDateTime:
                        type: string
                        format: date
                        description: Data e hora original da transação.
                      partieCnpjCpf:
                        type: string
                        description: >-
                          Identificação da pessoa envolvida na transação. —
                          Obrigatório para transações de pagamento a partir de
                          02/05/2023 (IN BCB nº 371) (condicional)
                      partiePersonType:
                        type: string
                        description: >-
                          Tipo de Pessoa da parte envolvida. — Condicional ao
                          preenchimento de partieCnpjCpf (condicional)
                        enum:
                          - PESSOA_NATURAL
                          - PESSOA_JURIDICA
                      partieCompeCode:
                        type: string
                        description: Código BCB da instituição da parte envolvida.
                      partieBranchCode:
                        type: string
                        description: Código da Agência da conta da parte envolvida.
                      partieNumber:
                        type: string
                        description: Número da conta da parte envolvida.
                      partieCheckDigit:
                        type: string
                        description: Dígito da conta da parte envolvida.
      description: '📌 Fonte OFB: Transações de Conta'
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: path
          required: true
          schema:
            type: string
  /users/{user_id}/credit-cards:
    get:
      tags:
        - Cartões de crédito
      summary: Listagem de cartões
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resposta 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      creditCardAccountId:
                        type: string
                        description: >-
                          Identifica de forma única a conta de cartão do
                          cliente.
                      brandName:
                        type: string
                        description: >-
                          Nome da Marca reportada pelo participante no Open
                          Finance.
                      companyCnpj:
                        type: string
                        description: CNPJ completo da instituição responsável.
                      name:
                        type: string
                        description: Denominação/Identificação do nome da conta de cartão.
                      productType:
                        type: string
                        description: Categoria atribuída ao cartão de pagamento.
                        enum:
                          - CLASSIC_NACIONAL
