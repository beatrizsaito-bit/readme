  /api/v1/notification:
    post:
      tags:
        - Notificações
      summary: Criar configuração de notificações
      operationId: createNotification
      description: >
        Configura os canais de notificação do tenant.


        > **Atenção:** este endpoint utiliza uma base URL distinta dos endpoints
        de dados.

        > Consulte seu contrato para obter a URL de produção correta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - channels
              properties:
                tenantId:
                  type: string
                channels:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - value
                      - enable
                    properties:
                      type:
                        type: string
                        enum:
                          - webhook
                          - slack
                          - email
                          - sms
                        description: >-
                          Tipos de contas. Modalidades tradicionais previstas
                          pela Resolução 4.753, não contemplando contas
                          vinculadas, conta de domiciliados no exterior, contas
                          em moedas estrangeiras e conta correspondente moeda
                          eletrônica. Vide Enum Conta de depósito à vista ou
                          Conta corrente - é o tipo mais comum. Nela, o
                      value:
                        type: string
                        description: URL, e-mail ou número de acordo com o tipo
                      enable:
                        type: boolean
                      secret:
                        type: string
                        nullable: true
                        description: >-
                          Secret HMAC para validação do webhook (apenas para
                          type=webhook)
            example:
              tenantId: seu-tenant-id
              channels:
                - type: webhook
                  value: https://sua-api.com/webhook
                  enable: true
                  secret: null
                - type: slack
                  value: https://hooks.slack.com/services/T00/B00/xxx
                  enable: true
                - type: email
                  value: ops@sua-empresa.com
                  enable: true
                - type: sms
                  value: '5511999999999'
                  enable: true
      responses:
        '201':
          description: Configuração criada
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required:
                      - tenantId
                      - channels
                    properties:
                      tenantId:
                        type: string
                      channels:
                        type: array
                        items:
                          type: object
                          required:
                            - type
                            - value
                            - enable
                          properties:
                            type:
                              type: string
                              enum:
                                - webhook
                                - slack
                                - email
                                - sms
                              description: >-
                                Tipo de conta de depósito.
                                CONTA_DEPOSITO_A_VISTA: conta corrente.
                                CONTA_POUPANCA: poupança.
                                CONTA_PAGAMENTO_PRE_PAGA: conta pré-paga.
                            value:
                              type: string
                              description: URL, e-mail ou número de acordo com o tipo
                            enable:
                              type: boolean
                            secret:
                              type: string
                              nullable: true
                              description: >-
                                Secret HMAC para validação do webhook (apenas
                                para type=webhook)
                  - type: object
                    properties:
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
              example:
                tenantId: seu-tenant-id
                channels:
                  - type: webhook
                    value: https://sua-api.com/webhook
                    enable: true
                    secret: null
                  - type: email
                    value: ops@sua-empresa.com
                    enable: true
                createdAt: '2025-03-20T19:22:17.646Z'
                updatedAt: '2025-03-20T19:22:17.646Z'
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
      parameters: []
