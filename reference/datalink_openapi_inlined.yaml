                              properties:
                                amount:
                                  type: string
                                  pattern: ^\d{1,15}\.\d{2,4}$
                                currency:
                                  type: string
                                  minLength: 3
                                  maxLength: 3
                                  description: Moeda ISO 4217
                              required:
