                            - currency
                        brazilianAmount:
                          type: object
                          properties:
                            amount:
                              type: string
                            currency:
                              type: string
                              minLength: 3
                              description: Moeda ISO 4217
                          required:
                            - amount
                            - currency
                        billId:
                          type: string
                        billPostDate:
                          type: string
                          format: date
                        transactionDateTime:
                          type: string
                          format: date-time
                        identificationNumber:
                          type: string
                        chargeIdentificator:
                          type: integer
                        chargeNumber:
                          type: integer
                        feeType:
                          type: string
                          nullable: true
                        feeTypeAdditionalInfo:
                          type: string
                          nullable: true
                        otherCreditsType:
                          type: string
                          nullable: true
                        payeeMCC:
                          type: integer
                          nullable: true
                        transactionalAdditionalInfo:
                          type: string
                          nullable: true
                      required:
                        - transactionId
                        - creditCardAccountId
                        - transactionName
                        - transactionType
                        - creditDebitType
                        - amount
                        - brazilianAmount
                        - billPostDate
                        - transactionDateTime
                        - identificationNumber
              example:
                data:
                  - transactionId: 65b65cee-0905-40ff-8a32-65741f436fb1
                    creditCardAccountId: 62726dba-e4b4-41b3-a6f2-68dca70df313
                    userId: 0e58fecb-5a34-4b2c-a1b2-d2f8626df017
