  /api/v1/users/{user_id}/credit-contracts/{credit_type}:
    get:
      tags:
        - Contratos de crédito
      summary: Listar contratos
      operationId: listCreditContracts
      description: >
        Retorna contratos de crédito por tipo. Valores de `credit_type`:


        | Valor | Produto | Permissão |

        |---|---|---|

        | `loans` | Empréstimos | `LOANS_READ` |

        | `financings` | Financiamentos | `FINANCINGS_READ` |

        | `unarranged-accounts-overdraft` | Conta garantida / adiantamento |
        `UNARRANGED_ACCOUNTS_OVERDRAFT_READ` |

        | `invoice-financings` | Antecipação de recebíveis |
        `INVOICE_FINANCINGS_READ` |
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: credit_type
          in: path
          required: true
          description: >-
            Tipo de contrato. Valores: loans, financings,
            unarranged-accounts-overdraft, invoice-financings
          schema:
            type: string
            enum:
              - loans
              - financings
              - unarranged-accounts-overdraft
              - invoice-financings
      responses:
        '200':
          description: Contratos do tipo solicitado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        contractId:
                          type: string
                        brandName:
                          type: string
                          description: >-
                            Nome da Marca reportada pelo participante no Open
                            Finance. Recomenda-se utilizar o mesmo nome
                            atribuído no campo Customer Friendly Server Name
                            (Authorisation Server).
                        companyCnpj:
                          type: string
                          description: >-
                            Número completo do CNPJ da instituição responsável —
                            apenas dígitos, sem máscara.
                        ipocCode:
                          type: string
                          description: >-
                            Identificador de Produto e Operação de Crédito —
                            código único do BCB
                        productType:
                          type: string
                          description: >-
                            Categoria atribuída ao cartão de pagamento, que lhe
                            agrega vantagens diferenciando-o por perfil do
                            portador.
                        productSubType:
                          type: string
                        organisationId:
                          type: string
                        authorisationServerId:
                          type: string
                        updatedAt:
                          type: string
                          format: date-time
                        details:
                          type: object
                          properties:
                            contractNumber:
                              type: string
                            productName:
                              type: string
                            contractDate:
                              type: string
                              format: date
                              nullable: true
                            disbursementDates:
                              type: array
                              items:
                                type: string
                                format: date
                              nullable: true
                            settlementDate:
                              type: string
                              format: date
                              nullable: true
                            contractAmount:
                              type: string
                            currency:
                              type: string
                            dueDate:
                              type: string
                              format: date
                            instalmentPeriodicity:
                              type: string
                              enum:
                                - SEM_PERIODICIDADE_REGULAR
                                - SEMANAL
                                - QUINZENAL
                                - MENSAL
                                - BIMESTRAL
                                - TRIMESTRAL
                                - SEMESTRAL
                                - ANUAL
                                - OUTROS
                            firstInstalmentDueDate:
                              type: string
                              format: date
                              nullable: true
                            CET:
                              type: string
                              description: Custo Efetivo Total
                            amortizationScheduled:
                              type: string
                              enum:
                                - SAC
                                - PRICE
                                - SAM
                                - SEM_SISTEMA_AMORTIZACAO
                                - OUTROS
                            interestRates:
                              type: array
                              items:
                                type: object
                                properties:
                                  taxType:
                                    type: string
                                    description: Tipo de taxa de juros pactuada.
                                    enum:
                                      - NOMINAL
                                      - EFETIVA
                                  interestRateType:
                                    type: string
                                    description: 'Tipo de juros: simples ou composto.'
                                    enum:
                                      - SIMPLES
                                      - COMPOSTO
                                  taxPeriodicity:
                                    type: string
                                    description: Periodicidade da taxa de juros.
                                    enum:
                                      - AM
                                      - AA
                                  calculation:
                                    type: string
                                    description: >-
                                      Base de cálculo da taxa de juros (ex:
                                      21/252).
                                  referentialRateIndexerType:
                                    type: string
                                    description: Tipo de indexador da taxa referencial.
                                    enum:
                                      - SEM_TIPO_INDEXADOR
                                      - PRE_FIXADO
                                      - POS_FIXADO
                                      - FLUTUANTES
                                      - INDICES_PRECOS
                                      - CREDITO_RURAL
                                      - OUTROS_INDEXADORES
                                  referentialRateIndexerSubType:
                                    type: string
                                    nullable: true
                                    description: Subtipo do indexador da taxa referencial.
                                    enum:
                                      - SEM_SUB_TIPO_INDEXADOR
                                      - PRE_FIXADO
                                      - TR_TBF
                                      - TJLP
                                      - LIBOR
                                      - TLP
                                      - OUTRAS_TAXAS_POS_FIXADAS
                                      - CDI
                                      - SELIC
                                      - OUTRAS_TAXAS_FLUTUANTES
                                      - IGPM
                                      - IPCA
                                      - IPCC
                                      - OUTROS_INDICES_PRECO
                                      - TCR_PRE
                                      - TCR_POS
                                      - TRFC_PRE
                                      - TRFC_POS
                                  referentialRateIndexerAdditionalInfo:
                                    type: string
                                    nullable: true
                                    description: >-
                                      Informação adicional sobre o indexador.
                                      Preenchido quando o subtipo não é
                                      suficiente.
                                  preFixedRate:
                                    type: string
                                    description: >-
                                      Taxa pré-fixada aplicada no período
                                      pactuado (ex: 0.015000).
                                  postFixedRate:
                                    type: string
                                    nullable: true
                                    description: >-
                                      Taxa pós-fixada aplicada no período
                                      pactuado (ex: 0.000000).
                                  additionalInfo:
                                    type: string
                                    nullable: true
                                    description: >-
                                      Informações adicionais sobre a taxa de
                                      juros pactuada.
                            contractedFees:
                              type: array
                              items:
                                type: object
                                properties:
                                  feeName:
                                    type: string
                                    description: >-
                                      Denominação da tarifa pactuada no contrato
                                      de crédito.
                                  feeCode:
                                    type: string
                                    description: >-
                                      Sigla identificadora da tarifa pactuada no
                                      contrato de crédito.
                                  feeChargeType:
                                    type: string
                                    description: >-
                                      Tipo de cobrança da tarifa: única por
                                      contrato ou por parcela.
                                    enum:
                                      - UNICA
                                      - POR_PARCELA
                                  feeCharge:
                                    type: string
                                    description: Forma de cobrança da tarifa pactuada.
                                    enum:
                                      - MINIMO
                                      - MAXIMO
                                      - FIXO
                                      - PERCENTUAL
                                  feeAmount:
                                    type: string
                                    nullable: true
                                    description: >-
                                      Valor monetário da tarifa pactuada no
                                      contrato (ex: 200.50).
                                  feeRate:
                                    type: string
                                    nullable: true
                                    description: >-
                                      Percentual da tarifa pactuada no contrato
                                      de crédito (ex: 0.000000).
                            contractedFinanceCharges:
                              type: array
                              items:
                                type: object
                                properties:
                                  chargeType:
                                    type: string
                                    description: >-
                                      Tipo de encargo pactuado no contrato de
                                      crédito.
                                    enum:
                                      - JUROS_REMUNERATORIOS_POR_ATRASO
                                      - MULTA_ATRASO_PAGAMENTO
                                      - JUROS_MORA_ATRASO
                                      - IOF_CONTRATACAO
                                      - IOF_POR_ATRASO
                                      - SEM_ENCARGO
                                      - OUTROS
                                  chargeAdditionalInfo:
                                    type: string
                                    nullable: true
                                    description: >-
                                      Informações adicionais sobre o encargo.
                                      Obrigatório quando chargeType = OUTROS.
                                  chargeRate:
                                    type: string
                                    nullable: true
                                    description: >-
                                      Percentual do encargo pactuado no contrato
                                      de crédito (ex: 0.060000).
                          required:
                            - contractNumber
                            - productName
                            - contractDate
                            - contractAmount
                            - currency
                            - dueDate
                            - instalmentPeriodicity
                            - CET
                            - amortizationScheduled
                            - interestRates
                            - contractedFees
                            - contractedFinanceCharges
                        warranties:
                          type: array
                          items:
                            type: object
                            properties:
                              currency:
                                type: string
                              warrantyType:
                                type: string
                                description: >-
                                  Denominação/Identificação do tipo da garantia
                                  que avaliza a Modalidade da Operação de
                                  Crédito contratada (Doc 3040, Anexo 12)
                                enum:
                                  - CESSAO_DIREITOS_CREDITORIOS
                                  - CAUCAO
                                  - PENHOR
                                  - ALIENACAO_FIDUCIARIA
                                  - HIPOTECA
                                  - OPERACOES_GARANTIDAS_PELO_GOVERNO
                                  - OUTRAS_GARANTIAS_NAO_FIDEJUSSORIAS
                                  - SEGUROS_ASSEMELHADOS
                                  - GARANTIA_FIDEJUSSORIA
                                  - BENS_ARRENDADOS
                                  - GARANTIAS_INTERNACIONAIS
                                  - OPERACOES_GARANTIDAS_OUTRAS_ENTIDADES
                                  - ACORDOS_COMPENSACAO
                              warrantySubType:
                                type: string
                                description: >-
                                  Denominação/Identificação do subtipo da
                                  garantia
                                enum:
                                  - ACOES_DEBENTURES
                                  - ASSET_BACKED_SECURITIES
                                  - CIVIL
                                  - COMMODITY
                                  - DEPOSITO_INTERBANCARIO
                                  - DIVIDA_EXTERNA
                                  - FUNDO
                                  - INDICES
                                  - JUROS
                                  - LIVRE
                                  - MOEDA_ESTRANGEIRA
                                  - PREVIDENCIA
                                  - RECEITAS
                                  - RESIDENCIAL_COMERCIAL
                                  - SEGUROS
                                  - TAXA_DE_JUROS
                                  - VALOR_MOBILIARIO
                              warrantyAmount:
                                type: string
                            required:
                              - currency
                              - warrantyType
                              - warrantySubType
                              - warrantyAmount
                      required:
                        - contractId
                        - brandName
                        - companyCnpj
                        - ipocCode
                        - productType
                        - productSubType
              example:
                data:
                  - contractId: dadd421d-184e-4689-a085-409d1bca4193
                    brandName: Aquisição de equipamentos
                    companyCnpj: '13832718000196'
                    ipocCode: 1.1815210402110117e+39
                    productType: EMPRESTIMOS
                    productSubType: CREDITO_PESSOAL_SEM_CONSIGNACAO
