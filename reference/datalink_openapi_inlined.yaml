      operationId: getRecurringExpenses
      description: >
        Identifica despesas recorrentes por padrão de frequência (assinaturas,
        mensalidades, contas fixas).

        Útil para avaliar comprometimento de renda em análise de crédito.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Custos recorrentes identificados
          content:
