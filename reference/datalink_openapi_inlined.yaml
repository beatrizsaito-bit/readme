                            - CONTA_POUPANCA
                            - CONTA_PAGAMENTO_PRE_PAGA
                          description: >-
                            Tipo de conta de depósito. CONTA_DEPOSITO_A_VISTA:
                            conta corrente. CONTA_POUPANCA: poupança.
                            CONTA_PAGAMENTO_PRE_PAGA: conta pré-paga.
