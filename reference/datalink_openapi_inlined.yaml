              schema:
                type: object
                properties:
                  allRecurringExpenses:
                    type: array
                    items:
                      type: object
                      properties:
                        count:
                          type: integer
                        frequency:
                          type: string
                          enum:
                            - day
                            - week
                            - month
                        transactionAmountNumber:
                          type: number
                        transactionName:
                          type: string
                      required:
                        - transactionName
                  totals:
