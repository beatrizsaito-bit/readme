openapi: 3.1.0
info:
  title: Data Link API
  version: 1.0.2
  description: >
    A API do Data Link abstrai o protocolo Open Finance Brasil e entrega os
    dados financeiros

    dos seus usuários via REST, normalizados e prontos para consumo.


    O fluxo tem duas etapas obrigatórias em sequência:

    1. **Consentimento** — o usuário autoriza o compartilhamento de dados na
    instituição financeira

    2. **Consulta** — você acessa os dados usando o `user_id` gerado após o
    consentimento


    Todos os endpoints de consulta requerem um `user_id` válido com
    consentimento `AUTHORISED`.

    Sem isso, a resposta será `403`.
  contact:
    name: Lina OpenX
    url: https://lina-itp.readme.io
servers:
  - url: '{base_url}'
    description: Ambiente configurado via variável
    variables:
      base_url:
        default: https://api.lina.com.br
        description: URL base da API
tags:
  - name: Consentimento
    description: Fluxo de criação e gestão de consentimentos Open Finance
  - name: Usuários
    description: Consulta e listagem de usuários do tenant
  - name: Contas
    description: Dados de contas bancárias — saldos, limites e transações
  - name: Cartões de crédito
    description: Dados de cartões — limites, transações e faturas
  - name: Contratos de crédito
    description: Empréstimos, financiamentos, conta garantida e antecipação de recebíveis
  - name: Investimentos
    description: Renda fixa, fundos, renda variável, Tesouro Direto e movimentações
  - name: Análise de dados
    description: >-
      Inteligência financeira — inferência de renda, recorrências, categorização
      e carteira
  - name: Notificações
    description: Configuração de canais de notificação do tenant
  - name: Métricas
    description: Métricas de uso da plataforma
security:
  - bearerAuth: []
paths:
  /api/v1/organisations:
    get:
      tags:
        - Consentimento
      summary: Listar participantes
      operationId: listOrganisations
      description: |
        Retorna as instituições financeiras disponíveis para consentimento.
        Use `OrganisationId` e `AuthorisationServerId` no `POST /consents`.
      responses:
        '200':
          description: Lista de participantes retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        OrganisationName:
                          type: string
                        OrganisationId:
                          type: string
                        LegalEntityName:
                          type: string
                        RegistrationNumber:
                          type: string
                          description: CNPJ (14 dígitos)
                        ParentOrganisationReference:
                          type: string
                        AuthorisationServers:
                          type: array
                          items:
                            type: object
                            properties:
                              AuthorisationServerId:
                                type: string
                              CustomerFriendlyName:
                                type: string
                              CustomerFriendlyDescription:
                                type: string
                              CustomerFriendlyLogoUri:
                                type: string
                                format: uri
                              ApiResources:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    ApiResourceId:
                                      type: string
                                      description: Identificador único do recurso de API.
                                    ApiVersion:
                                      type: integer
                                      description: Versão do recurso de API.
                                    ApiDiscoveryEndpoints:
                                      type: array
                                      description: Endpoints de descoberta do recurso.
                                      items:
                                        type: object
                                        properties:
                                          ApiDiscoveryId:
                                            type: string
                                          ApiEndpoint:
                                            type: string
                                            description: URL do endpoint de API.
              example:
                data:
                  - OrganisationName: Banco Exemplo
                    OrganisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    LegalEntityName: Banco Exemplo S.A.
                    RegistrationNumber: '43142666000197'
                    ParentOrganisationReference: '43142666000197'
                    AuthorisationServers:
                      - AuthorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                        CustomerFriendlyName: Banco Exemplo
                        CustomerFriendlyDescription: Servidor de autorização do Banco Exemplo
                        CustomerFriendlyLogoUri: https://www.bancoexemplo.com.br/logo.png
                        ApiResources: []
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
      parameters: []
  /api/v1/consents:
    post:
      tags:
        - Consentimento
      summary: Criar consentimento
      operationId: createConsent
      description: >
        Inicia o fluxo de consentimento. Retorna uma `redirectUrl` para onde o
        usuário

        deve ser redirecionado para autenticar na instituição financeira.


        > **Atenção:** as permissões devem ser enviadas **por agrupamento
        completo**.

        > Enviar permissões incompletas de um grupo resulta em `400`.


        O status inicial é sempre `AWAITING_AUTHORISATION`. Se o usuário não
        confirmar

        em **60 minutos**, o status muda automaticamente para `REJECTED`.


        **Permissões por agrupamento:**


        | Categoria | Agrupamento | Permissões obrigatórias |

        |---|---|---|

        | Cadastro | Identificação PF |
        `CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ`, `RESOURCES_READ` |

        | Cadastro | Info complementar PF |
        `CUSTOMERS_PERSONAL_ADITTIONALINFO_READ`, `RESOURCES_READ` |

        | Cadastro | Identificação PJ |
        `CUSTOMERS_BUSINESS_IDENTIFICATIONS_READ`, `RESOURCES_READ` |

        | Cadastro | Info complementar PJ |
        `CUSTOMERS_BUSINESS_ADITTIONALINFO_READ`, `RESOURCES_READ` |

        | Contas | Saldos | `ACCOUNTS_READ`, `ACCOUNTS_BALANCES_READ`,
        `RESOURCES_READ` |

        | Contas | Limites | `ACCOUNTS_READ`, `ACCOUNTS_OVERDRAFT_LIMITS_READ`,
        `RESOURCES_READ` |

        | Contas | Extratos | `ACCOUNTS_READ`, `ACCOUNTS_TRANSACTIONS_READ`,
        `RESOURCES_READ` |

        | Cartão | Limites | `CREDIT_CARDS_ACCOUNTS_READ`,
        `CREDIT_CARDS_ACCOUNTS_LIMITS_READ`, `RESOURCES_READ` |

        | Cartão | Transações | `CREDIT_CARDS_ACCOUNTS_READ`,
        `CREDIT_CARDS_ACCOUNTS_TRANSACTIONS_READ`, `RESOURCES_READ` |

        | Cartão | Faturas | `CREDIT_CARDS_ACCOUNTS_READ`,
        `CREDIT_CARDS_ACCOUNTS_BILLS_READ`,
        `CREDIT_CARDS_ACCOUNTS_BILLS_TRANSACTIONS_READ`, `RESOURCES_READ` |

        | Crédito | Empréstimos | `LOANS_READ`, `LOANS_WARRANTIES_READ`,
        `LOANS_SCHEDULED_INSTALMENTS_READ`, `LOANS_PAYMENTS_READ`,
        `RESOURCES_READ` |

        | Crédito | Financiamentos | `FINANCINGS_READ`,
        `FINANCINGS_WARRANTIES_READ`, `FINANCINGS_SCHEDULED_INSTALMENTS_READ`,
        `FINANCINGS_PAYMENTS_READ`, `RESOURCES_READ` |

        | Crédito | Conta garantida | `UNARRANGED_ACCOUNTS_OVERDRAFT_READ`,
        `UNARRANGED_ACCOUNTS_OVERDRAFT_WARRANTIES_READ`,
        `UNARRANGED_ACCOUNTS_OVERDRAFT_SCHEDULED_INSTALMENTS_READ`,
        `UNARRANGED_ACCOUNTS_OVERDRAFT_PAYMENTS_READ`, `RESOURCES_READ` |

        | Crédito | Antecipação | `INVOICE_FINANCINGS_READ`,
        `INVOICE_FINANCINGS_WARRANTIES_READ`,
        `INVOICE_FINANCINGS_SCHEDULED_INSTALMENTS_READ`,
        `INVOICE_FINANCINGS_PAYMENTS_READ`, `RESOURCES_READ` |

        | Investimentos | Renda fixa bancária | `BANK_FIXED_INCOMES_READ`,
        `RESOURCES_READ` |

        | Investimentos | Renda fixa crédito | `CREDIT_FIXED_INCOMES_READ`,
        `RESOURCES_READ` |

        | Investimentos | Fundos | `FUNDS_READ`, `RESOURCES_READ` |

        | Investimentos | Renda variável | `VARIABLE_INCOMES_READ`,
        `RESOURCES_READ` |

        | Investimentos | Tesouro Direto | `TREASURE_TITLES_READ`,
        `RESOURCES_READ` |

        | Câmbio | Operações | `EXCHANGES_READ`, `RESOURCES_READ` |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - organisationId
                - authorisationServerId
                - consent
              properties:
                organisationId:
                  type: string
                  description: Obtido em `GET /organisations`
                authorisationServerId:
                  type: string
                  description: Obtido em `GET /organisations`
                consent:
                  type: object
                  required:
                    - permissions
                  properties:
                    loggedUser:
                      type: object
                      description: CPF (PF) ou CNPJ (PJ) — enviar apenas um
                      properties:
                        cpf:
                          type: string
                          description: CPF sem máscara (11 dígitos)
                        cnpj:
                          type: string
                          description: CNPJ sem máscara (14 dígitos)
                    permissions:
                      type: array
                      items:
                        type: string
                      description: >-
                        Lista de permissões — devem ser enviadas por agrupamento
                        completo
                    expirationDateTime:
                      type: string
                      format: date-time
                      description: Omitir para consentimento por prazo indeterminado
            examples:
              pf_completo:
                summary: PF — contas, cartão, crédito e investimentos
                value:
                  organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                  authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                  consent:
                    loggedUser:
                      cpf: '12345678909'
                    permissions:
                      - RESOURCES_READ
                      - CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ
                      - CUSTOMERS_PERSONAL_ADITTIONALINFO_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_OVERDRAFT_LIMITS_READ
                      - ACCOUNTS_TRANSACTIONS_READ
                      - CREDIT_CARDS_ACCOUNTS_READ
                      - CREDIT_CARDS_ACCOUNTS_LIMITS_READ
                      - CREDIT_CARDS_ACCOUNTS_TRANSACTIONS_READ
                      - CREDIT_CARDS_ACCOUNTS_BILLS_READ
                      - CREDIT_CARDS_ACCOUNTS_BILLS_TRANSACTIONS_READ
                      - LOANS_READ
                      - LOANS_WARRANTIES_READ
                      - LOANS_SCHEDULED_INSTALMENTS_READ
                      - LOANS_PAYMENTS_READ
                      - BANK_FIXED_INCOMES_READ
                      - FUNDS_READ
                      - VARIABLE_INCOMES_READ
                      - TREASURE_TITLES_READ
              pj_basico:
                summary: PJ — cadastro e contas
                value:
                  organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                  authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                  consent:
                    loggedUser:
                      cnpj: '11222333000181'
                    permissions:
                      - RESOURCES_READ
                      - CUSTOMERS_BUSINESS_IDENTIFICATIONS_READ
                      - CUSTOMERS_BUSINESS_ADITTIONALINFO_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_TRANSACTIONS_READ
      responses:
        '201':
          description: Consentimento criado — redirecione o usuário para a redirectUrl
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectUrl:
                    type: string
                    format: uri
                    description: >-
                      URL para redirecionar o usuário à instituição financeira.
                      Expira em 60 minutos.
              example:
                redirectUrl: >-
                  https://auth.{instituicao}.com.br/auth?request_uri=urn%3Aietf%3Aparams%3Aoauth%3Arequest_uri%3AD2AKVKARaSdsGQ5KF_8Q8&client_id=yXYqweXJXhxqMebXy7j_e&state=WD2D99Nhn3nse80JoBP87n
        '400':
          description: >-
            Payload inválido — campo faltando, mal formatado ou permissão
            incompleta
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
              examples:
                permissao_invalida:
                  summary: Permissão enviada sem agrupamento completo
                  value:
                    errors:
                      - code: PERMISSAO_INVALIDA
                        title: Permissão inválida
                        detail: >-
                          A permissão 'ACCOUNTS_BALANCES_READ' requer que
                          'ACCOUNTS_READ' também seja enviada no mesmo
                          agrupamento.
                    meta:
                      requestDateTime: '2026-05-13T12:00:00Z'
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
      parameters: []
    get:
      tags:
        - Consentimento
      summary: Listar consentimentos por tenant (admin)
      operationId: listConsentsByTenant
      description: >-
        Visão administrativa de todos os consentimentos do tenant com filtros e
        paginação.
      parameters:
        - name: page
          in: query
          description: Número da página
          schema:
            type: integer
          required: false
        - name: limit
          in: query
          description: Registros por página
          schema:
            type: integer
          required: false
        - name: sortBy
          in: query
          description: Campo de ordenação
          schema:
            type: string
          required: false
        - name: sortOrder
          in: query
          description: 'Direção da ordenação: asc ou desc'
          schema:
            type: string
          required: false
        - name: status
          in: query
          description: >-
            Filtro por status do consentimento: AUTHORISED,
            AWAITING_AUTHORISATION, REJECTED, REVOKED
          schema:
            type: string
            enum:
              - AUTHORISED
              - AWAITING_AUTHORISATION
              - REJECTED
              - REVOKED
          required: false
        - name: search
          in: query
          description: CPF (11 dígitos) ou CNPJ (14 dígitos)
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Lista de consentimentos do tenant
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
  /api/v1/users/{user_id}/consents:
    get:
      tags:
        - Consentimento
      summary: Listar consentimentos do usuário
      operationId: listUserConsents
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de consentimentos do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        consentId:
                          type: string
                        creationDateTime:
                          type: string
                          format: date-time
                        status:
                          type: string
                          enum:
                            - AWAITING_AUTHORISATION
                            - AUTHORISED
                            - REJECTED
                            - REVOKED
                          description: >
                            Status do consentimento:

                            - `AWAITING_AUTHORISATION`: criado, aguardando
                            confirmação do usuário (expira em 60 min)

                            - `AUTHORISED`: usuário confirmou — dados
                            disponíveis para consulta

                            - `REJECTED`: usuário rejeitou ou prazo expirou

                            - `REVOKED`: revogado pelo usuário ou pela aplicação
                        statusUpdateDateTime:
                          type: string
                          format: date-time
                        permissions:
                          type: array
                          items:
                            type: string
                        organisationId:
                          type: string
                        authorisationServerId:
                          type: string
                        rejection:
                          type: object
                          nullable: true
                          properties:
                            rejectedBy:
                              type: string
                              enum:
                                - USER
                                - ASPSP
                            reason:
                              type: object
                              properties:
                                code:
                                  type: string
              example:
                data:
                  - userId: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
                    consentId: urn:raidiambank:23f1a40c-6c9e-4c76-998c-d33d7c546818
                    creationDateTime: '2025-02-14T11:28:11Z'
                    status: REJECTED
                    statusUpdateDateTime: '2025-02-14T11:29:41Z'
                    permissions:
                      - RESOURCES_READ
                      - ACCOUNTS_READ
                    organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                    rejection:
                      rejectedBy: USER
                      reason:
                        code: CUSTOMER_MANUALLY_REVOKED
                  - userId: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
                    consentId: urn:raidiambank:2d076b0d-7b01-4822-9147-9303120eb1d3
                    creationDateTime: '2025-02-10T20:06:44Z'
                    status: AUTHORISED
                    statusUpdateDateTime: '2025-02-10T20:07:23Z'
                    permissions:
                      - RESOURCES_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_TRANSACTIONS_READ
                    organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
        '404':
          description: >-
            Recurso não encontrado — user_id, account_id ou consent_id
            inexistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
              example:
                errors:
                  - code: USUARIO_NAO_ENCONTRADO
                    title: Usuário não encontrado
                    detail: >-
                      Nenhum usuário encontrado para o userId informado.
                      Verifique se o callback de consentimento foi concluído com
                      sucesso.
  /api/v1/users/{user_id}/consents/{consent_id}:
    get:
      tags:
        - Consentimento
      summary: Recuperar consentimento específico
      operationId: getConsent
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: consent_id
          in: path
          required: true
          description: ID do consentimento no formato urn:{instituição}:{uuid}
          schema:
            type: string
      responses:
        '200':
          description: Consentimento encontrado
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
        '404':
          description: >-
            Recurso não encontrado — user_id, account_id ou consent_id
            inexistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
              example:
                errors:
                  - code: USUARIO_NAO_ENCONTRADO
                    title: Usuário não encontrado
                    detail: >-
                      Nenhum usuário encontrado para o userId informado.
                      Verifique se o callback de consentimento foi concluído com
                      sucesso.
    delete:
      tags:
        - Consentimento
      summary: Revogar consentimento
      operationId: revokeConsent
      description: >-
        Revoga o consentimento do usuário. Após a revogação nenhum dado novo
        será coletado.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
        - name: consent_id
          in: path
          required: true
          description: ID do consentimento no formato urn:{instituição}:{uuid}
          schema:
            type: string
      responses:
        '200':
          description: Consentimento revogado
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
        '404':
          description: >-
            Recurso não encontrado — user_id, account_id ou consent_id
            inexistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Código do erro
                        title:
                          type: string
                          description: Título legível
                        detail:
                          type: string
                          description: Descrição detalhada do problema
                  meta:
                    type: object
                    properties:
                      requestDateTime:
                        type: string
                        format: date-time
              example:
                errors:
                  - code: USUARIO_NAO_ENCONTRADO
                    title: Usuário não encontrado
                    detail: >-
                      Nenhum usuário encontrado para o userId informado.
                      Verifique se o callback de consentimento foi concluído com
                      sucesso.
  /api/v1/users:
    get:
      tags:
        - Usuários
      summary: Listar usuários do tenant
      operationId: listUsers
