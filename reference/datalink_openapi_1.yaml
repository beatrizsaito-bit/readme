openapi: 3.1.0
info:
  title: Data Link API
  version: 1.0.2
  description: >
    A API do Data Link abstrai o protocolo Open Finance Brasil e entrega os
    dados financeiros

    dos seus usuários via REST, normalizados e prontos para consumo.


    O fluxo tem duas etapas obrigatórias em sequência:

    1. **Consentimento** — o usuário autoriza o compartilhamento de dados na
    instituição financeira

    2. **Consulta** — você acessa os dados usando o `user_id` gerado após o
    consentimento


    Todos os endpoints de consulta requerem um `user_id` válido com
    consentimento `AUTHORISED`.

    Sem isso, a resposta será `403`.
  contact:
    name: Lina OpenX
    url: https://lina-itp.readme.io
servers:
  - url: '{base_url}'
    description: Ambiente configurado via variável
    variables:
      base_url:
        default: https://api.lina.com.br
        description: URL base da API
tags:
  - name: Consentimento
    description: Fluxo de criação e gestão de consentimentos Open Finance
  - name: Usuários
    description: Consulta e listagem de usuários do tenant
  - name: Contas
    description: Dados de contas bancárias — saldos, limites e transações
  - name: Cartões de crédito
    description: Dados de cartões — limites, transações e faturas
  - name: Contratos de crédito
    description: Empréstimos, financiamentos, conta garantida e antecipação de recebíveis
  - name: Investimentos
    description: Renda fixa, fundos, renda variável, Tesouro Direto e movimentações
  - name: Análise de dados
    description: >-
      Inteligência financeira — inferência de renda, recorrências, categorização
      e carteira
  - name: Notificações
    description: Configuração de canais de notificação do tenant
  - name: Métricas
    description: Métricas de uso da plataforma
security:
  - bearerAuth: []
paths:
  /api/v1/organisations:
    get:
      tags:
        - Consentimento
      summary: Listar participantes
      operationId: listOrganisations
      description: |
        Retorna as instituições financeiras disponíveis para consentimento.
        Use `OrganisationId` e `AuthorisationServerId` no `POST /consents`.
      responses:
        '200':
          description: Lista de participantes retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organisation'
              example:
                data:
                  - OrganisationName: Banco Exemplo
                    OrganisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    LegalEntityName: Banco Exemplo S.A.
                    RegistrationNumber: '43142666000197'
                    ParentOrganisationReference: '43142666000197'
                    AuthorisationServers:
                      - AuthorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                        CustomerFriendlyName: Banco Exemplo
                        CustomerFriendlyDescription: Servidor de autorização do Banco Exemplo
                        CustomerFriendlyLogoUri: https://www.bancoexemplo.com.br/logo.png
                        ApiResources: []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/consents:
    post:
      tags:
        - Consentimento
      summary: Criar consentimento
      operationId: createConsent
      description: >
        Inicia o fluxo de consentimento. Retorna uma `redirectUrl` para onde o
        usuário

        deve ser redirecionado para autenticar na instituição financeira.


        > **Atenção:** as permissões devem ser enviadas **por agrupamento
        completo**.

        > Enviar permissões incompletas de um grupo resulta em `400`.


        O status inicial é sempre `AWAITING_AUTHORISATION`. Se o usuário não
        confirmar

        em **60 minutos**, o status muda automaticamente para `REJECTED`.


        **Permissões por agrupamento:**


        | Categoria | Agrupamento | Permissões obrigatórias |

        |---|---|---|

        | Cadastro | Identificação PF |
        `CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ`, `RESOURCES_READ` |

        | Cadastro | Info complementar PF |
        `CUSTOMERS_PERSONAL_ADITTIONALINFO_READ`, `RESOURCES_READ` |

        | Cadastro | Identificação PJ |
        `CUSTOMERS_BUSINESS_IDENTIFICATIONS_READ`, `RESOURCES_READ` |

        | Cadastro | Info complementar PJ |
        `CUSTOMERS_BUSINESS_ADITTIONALINFO_READ`, `RESOURCES_READ` |

        | Contas | Saldos | `ACCOUNTS_READ`, `ACCOUNTS_BALANCES_READ`,
        `RESOURCES_READ` |

        | Contas | Limites | `ACCOUNTS_READ`, `ACCOUNTS_OVERDRAFT_LIMITS_READ`,
        `RESOURCES_READ` |

        | Contas | Extratos | `ACCOUNTS_READ`, `ACCOUNTS_TRANSACTIONS_READ`,
        `RESOURCES_READ` |

        | Cartão | Limites | `CREDIT_CARDS_ACCOUNTS_READ`,
        `CREDIT_CARDS_ACCOUNTS_LIMITS_READ`, `RESOURCES_READ` |

        | Cartão | Transações | `CREDIT_CARDS_ACCOUNTS_READ`,
        `CREDIT_CARDS_ACCOUNTS_TRANSACTIONS_READ`, `RESOURCES_READ` |

        | Cartão | Faturas | `CREDIT_CARDS_ACCOUNTS_READ`,
        `CREDIT_CARDS_ACCOUNTS_BILLS_READ`,
        `CREDIT_CARDS_ACCOUNTS_BILLS_TRANSACTIONS_READ`, `RESOURCES_READ` |

        | Crédito | Empréstimos | `LOANS_READ`, `LOANS_WARRANTIES_READ`,
        `LOANS_SCHEDULED_INSTALMENTS_READ`, `LOANS_PAYMENTS_READ`,
        `RESOURCES_READ` |

        | Crédito | Financiamentos | `FINANCINGS_READ`,
        `FINANCINGS_WARRANTIES_READ`, `FINANCINGS_SCHEDULED_INSTALMENTS_READ`,
        `FINANCINGS_PAYMENTS_READ`, `RESOURCES_READ` |

        | Crédito | Conta garantida | `UNARRANGED_ACCOUNTS_OVERDRAFT_READ`,
        `UNARRANGED_ACCOUNTS_OVERDRAFT_WARRANTIES_READ`,
        `UNARRANGED_ACCOUNTS_OVERDRAFT_SCHEDULED_INSTALMENTS_READ`,
        `UNARRANGED_ACCOUNTS_OVERDRAFT_PAYMENTS_READ`, `RESOURCES_READ` |

        | Crédito | Antecipação | `INVOICE_FINANCINGS_READ`,
        `INVOICE_FINANCINGS_WARRANTIES_READ`,
        `INVOICE_FINANCINGS_SCHEDULED_INSTALMENTS_READ`,
        `INVOICE_FINANCINGS_PAYMENTS_READ`, `RESOURCES_READ` |

        | Investimentos | Renda fixa bancária | `BANK_FIXED_INCOMES_READ`,
        `RESOURCES_READ` |

        | Investimentos | Renda fixa crédito | `CREDIT_FIXED_INCOMES_READ`,
        `RESOURCES_READ` |

        | Investimentos | Fundos | `FUNDS_READ`, `RESOURCES_READ` |

        | Investimentos | Renda variável | `VARIABLE_INCOMES_READ`,
        `RESOURCES_READ` |

        | Investimentos | Tesouro Direto | `TREASURE_TITLES_READ`,
        `RESOURCES_READ` |

        | Câmbio | Operações | `EXCHANGES_READ`, `RESOURCES_READ` |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRequest'
            examples:
              pf_completo:
                summary: PF — contas, cartão, crédito e investimentos
                value:
                  organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                  authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                  consent:
                    loggedUser:
                      cpf: '12345678909'
                    permissions:
                      - RESOURCES_READ
                      - CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ
                      - CUSTOMERS_PERSONAL_ADITTIONALINFO_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_OVERDRAFT_LIMITS_READ
                      - ACCOUNTS_TRANSACTIONS_READ
                      - CREDIT_CARDS_ACCOUNTS_READ
                      - CREDIT_CARDS_ACCOUNTS_LIMITS_READ
                      - CREDIT_CARDS_ACCOUNTS_TRANSACTIONS_READ
                      - CREDIT_CARDS_ACCOUNTS_BILLS_READ
                      - CREDIT_CARDS_ACCOUNTS_BILLS_TRANSACTIONS_READ
                      - LOANS_READ
                      - LOANS_WARRANTIES_READ
                      - LOANS_SCHEDULED_INSTALMENTS_READ
                      - LOANS_PAYMENTS_READ
                      - BANK_FIXED_INCOMES_READ
                      - FUNDS_READ
                      - VARIABLE_INCOMES_READ
                      - TREASURE_TITLES_READ
              pj_basico:
                summary: PJ — cadastro e contas
                value:
                  organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                  authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                  consent:
                    loggedUser:
                      cnpj: '11222333000181'
                    permissions:
                      - RESOURCES_READ
                      - CUSTOMERS_BUSINESS_IDENTIFICATIONS_READ
                      - CUSTOMERS_BUSINESS_ADITTIONALINFO_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_TRANSACTIONS_READ
      responses:
        '201':
          description: Consentimento criado — redirecione o usuário para a redirectUrl
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectUrl:
                    type: string
                    format: uri
                    description: >-
                      URL para redirecionar o usuário à instituição financeira.
                      Expira em 60 minutos.
              example:
                redirectUrl: >-
                  https://auth.{instituicao}.com.br/auth?request_uri=urn%3Aietf%3Aparams%3Aoauth%3Arequest_uri%3AD2AKVKARaSdsGQ5KF_8Q8&client_id=yXYqweXJXhxqMebXy7j_e&state=WD2D99Nhn3nse80JoBP87n
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Consentimento
      summary: Listar consentimentos por tenant (admin)
      operationId: listConsentsByTenant
      description: >-
        Visão administrativa de todos os consentimentos do tenant com filtros e
        paginação.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Número da página
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Registros por página
        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              - status
          description: Campo de ordenação
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
          description: Direção da ordenação
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ConsentStatus'
          description: Filtrar por status
        - name: search
          in: query
          schema:
            type: string
          description: CPF (11 dígitos) ou CNPJ (14 dígitos) para busca
      responses:
        '200':
          description: Lista de consentimentos do tenant
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/consents/callback:
    post:
      tags:
        - Consentimento
      summary: Validar callback
      operationId: validateCallback
      description: >
        Chamado pelo seu backend após a instituição redirecionar o usuário de
        volta.

        Valida o código de autorização OAuth e retorna o `user_id` usado em
        todos os endpoints de dados.


        > **Importante:** persista o `userId` retornado — ele é o identificador
        principal

        > para todas as consultas subsequentes.
      parameters:
        - name: tenant_id
          in: header
          required: true
          schema:
            type: string
          description: Identificador da sua organização na plataforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
            example:
              state: E7GVvLmLh1OQpr2Ea3n83Um1NpWqFdUDFbYE0j8nzpTPO5HPRuIpxXyGS2TAq0x
              code: mmT7ZRcAP4i8Ebh9lmgLzPUsL5265IVePwkHTHbiXcK
              idToken: eyJhbGciOiJQUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '201':
          description: Callback validado — user_id disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackResponse'
              example:
                userId: cb9440aa-fcf0-4079-a95a-f9b1f6cf0bad
                authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                consentId: urn:raidiambank:8345d4d3-750d-494d-823e-047d384790e8
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/consents/{id}/sync:
    get:
      tags:
        - Consentimento
      summary: Sync de consentimento
      operationId: syncConsent
      description: >-
        Força a atualização do status do consentimento diretamente na
        instituição financeira.
      parameters:
        - $ref: '#/components/parameters/consent_id_path'
      responses:
        '200':
          description: Consentimento atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConsentDetail'
              example:
                data:
                  userId: 0e58fecb-5a34-4b2c-a1b2-d2f8626df017
                  consentId: urn:raidiambank:8345d4d3-750d-494d-823e-047d384790e8
                  creationDateTime: '2024-09-09T17:24:44Z'
                  status: AUTHORISED
                  statusUpdateDateTime: '2024-09-09T17:25:13Z'
                  permissions:
                    - RESOURCES_READ
                    - ACCOUNTS_READ
                    - ACCOUNTS_BALANCES_READ
                  organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                  authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                  version: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{user_id}/consents:
    get:
      tags:
        - Consentimento
      summary: Listar consentimentos do usuário
      operationId: listUserConsents
      parameters:
        - $ref: '#/components/parameters/user_id'
      responses:
        '200':
          description: Lista de consentimentos do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentSummary'
              example:
                data:
                  - userId: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
                    consentId: urn:raidiambank:23f1a40c-6c9e-4c76-998c-d33d7c546818
                    creationDateTime: '2025-02-14T11:28:11Z'
                    status: REJECTED
                    statusUpdateDateTime: '2025-02-14T11:29:41Z'
                    permissions:
                      - RESOURCES_READ
                      - ACCOUNTS_READ
                    organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                    rejection:
                      rejectedBy: USER
                      reason:
                        code: CUSTOMER_MANUALLY_REVOKED
                  - userId: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
                    consentId: urn:raidiambank:2d076b0d-7b01-4822-9147-9303120eb1d3
                    creationDateTime: '2025-02-10T20:06:44Z'
                    status: AUTHORISED
                    statusUpdateDateTime: '2025-02-10T20:07:23Z'
                    permissions:
                      - RESOURCES_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_TRANSACTIONS_READ
                    organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{user_id}/consents/{consent_id}:
    get:
      tags:
        - Consentimento
      summary: Recuperar consentimento específico
      operationId: getConsent
      parameters:
        - $ref: '#/components/parameters/user_id'
        - $ref: '#/components/parameters/consent_id'
      responses:
        '200':
          description: Consentimento encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Consentimento
      summary: Revogar consentimento
      operationId: revokeConsent
      description: >-
        Revoga o consentimento do usuário. Após a revogação nenhum dado novo
        será coletado.
      parameters:
        - $ref: '#/components/parameters/user_id'
        - $ref: '#/components/parameters/consent_id'
      responses:
        '200':
          description: Consentimento revogado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users:
    get:
      tags:
        - Usuários
      summary: Listar usuários do tenant
      operationId: listUsers
      description: >
        Retorna todos os usuários com consentimento no tenant.


        > **Atenção:** os campos `cpf` e `cnpj` retornam valores **hasheados
        (MD5)**,

        > não o documento em texto claro.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  page:
                    type: integer
                  limit:
                    type: integer
              example:
                data:
                  - userId: 5566421e-a4db-4e8f-9047-1c7df9c558a2
                    cpf: 1094d9605cd90473ba681351289c4f6e
                    cnpj: null
                    banks:
                      - authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                        organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    updatedAt: '2025-08-05T18:37:42.058Z'
                page: 1
                limit: 50
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/{user_id}:
    get:
      tags:
        - Usuários
      summary: Recuperar usuário
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/user_id'
      responses:
        '200':
          description: Usuário encontrado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{user_id}/accounts:
    get:
      tags:
        - Contas
      summary: Listar contas
      operationId: listAccounts
      description: |
        Retorna contas correntes, poupanças e pré-pagas.
        Requer permissão `ACCOUNTS_READ`.
      parameters:
        - $ref: '#/components/parameters/user_id'
      responses:
        '200':
          description: Contas do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
              example:
                data:
                  - accountId: 291e5a29-49ed-401f-a583-193caa7acddd
                    brandName: Sib Bank
                    companyCnpj: '40156018000100'
                    compeCode: '123'
                    branchCode: '6272'
                    number: '11188222'
                    checkDigit: '4'
                    type: CONTA_POUPANCA
                    organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                    updatedAt: '2024-09-09T18:00:46.349Z'
                    details:
                      type: CONTA_POUPANCA
                      subtype: INDIVIDUAL
                      currency: BRL
                    balance:
                      availableAmount:
                        amount: '41233.07'
                        currency: BRL
                      blockedAmount:
                        amount: '999.99'
                        currency: BRL
                      automaticallyInvestedAmount:
                        amount: '15000.00'
                        currency: BRL
                      updateDateTime: '2024-09-09T10:53:52Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{user_id}/accounts/sync:
    get:
      tags:
        - Contas
      summary: Sync de contas
      operationId: syncAccounts
      description: >-
        Força atualização direto na instituição. Mesma estrutura de resposta que
        `GET /accounts`.
      parameters:
        - $ref: '#/components/parameters/user_id'
      responses:
        '200':
          description: Contas atualizadas
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/{user_id}/accounts/{account_id}/transactions:
    get:
      tags:
        - Contas
      summary: Transações de conta
      operationId: listAccountTransactions
      description: Requer permissão `ACCOUNTS_TRANSACTIONS_READ`.
      parameters:
        - $ref: '#/components/parameters/user_id'
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da conta
      responses:
        '200':
          description: Transações da conta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountTransaction'
              example:
                data:
                  - transactionId: 901827b9-aba7-40c4-96a1-dd48846f3f57
                    accountId: 291e5a29-49ed-401f-a583-193caa7acddd
                    userId: 0e58fecb-5a34-4b2c-a1b2-d2f8626df017
                    completedAuthorisedPaymentType: TRANSACAO_EFETIVADA
                    creditDebitType: DEBITO
                    transactionName: PAGAMENTO
                    type: CARTAO
                    transactionAmount:
                      amount: '771.52'
                      currency: BRL
                    transactionDateTime: '2024-03-13T00:00:00.000Z'
                    partiePersonType: PESSOA_NATURAL
                    partieCnpjCpf: '87517400444'
                    partieCompeCode: '123'
                    partieBranchCode: '6272'
                    partieNumber: '94088392'
                    partieCheckDigit: '4'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{user_id}/accounts/{account_id}/transactions/sync:
    get:
      tags:
        - Contas
      summary: Sync de transações de conta
      operationId: syncAccountTransactions
      description: >-
        Força atualização. Mesma estrutura que `GET
        /accounts/{account_id}/transactions`.
      parameters:
        - $ref: '#/components/parameters/user_id'
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transações atualizadas
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/{user_id}/credit-cards:
    get:
      tags:
        - Cartões de crédito
      summary: Listar cartões
      operationId: listCreditCards
      description: Requer permissão `CREDIT_CARDS_ACCOUNTS_READ`.
      parameters:
        - $ref: '#/components/parameters/user_id'
      responses:
        '200':
          description: Cartões do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditCard'
