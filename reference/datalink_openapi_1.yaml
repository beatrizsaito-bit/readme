  /api/v1/notification:
    post:
      tags:
        - Notificações
      summary: Criar configuração de notificações
      operationId: createNotification
      description: >
        Configura os canais de notificação do tenant.


        > **Atenção:** este endpoint utiliza uma base URL distinta dos endpoints
        de dados.

        > Consulte seu contrato para obter a URL de produção correta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationConfig'
            example:
              tenantId: seu-tenant-id
              channels:
                - type: webhook
                  value: https://sua-api.com/webhook
                  enable: true
                  secret: null
                - type: slack
                  value: https://hooks.slack.com/services/T00/B00/xxx
                  enable: true
                - type: email
                  value: ops@sua-empresa.com
                  enable: true
                - type: sms
                  value: '5511999999999'
                  enable: true
      responses:
        '201':
          description: Configuração criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConfigResponse'
              example:
                tenantId: seu-tenant-id
                channels:
                  - type: webhook
                    value: https://sua-api.com/webhook
                    enable: true
                    secret: null
                  - type: email
                    value: ops@sua-empresa.com
                    enable: true
                createdAt: '2025-03-20T19:22:17.646Z'
                updatedAt: '2025-03-20T19:22:17.646Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notification/{tenant_id}:
    get:
      tags:
        - Notificações
      summary: Consultar configurações de notificação
      operationId: getNotification
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
          description: ID do tenant
      responses:
        '200':
          description: Configuração atual de notificações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Notificações
      summary: Atualizar canais de notificação
      operationId: updateNotification
      description: |
        Substitui a configuração de canais. Envie todos os canais desejados —
        canais omitidos são removidos.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationConfig'
            example:
              tenantId: seu-tenant-id
              channels:
                - type: webhook
                  value: https://sua-api.com/novo-webhook
                  enable: true
                  secret: null
                - type: email
                  value: novo-ops@sua-empresa.com
                  enable: true
      responses:
        '200':
          description: Configuração atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token obtido via OAuth 2.0 client_credentials
  parameters:
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID do usuário — obtido no callback de consentimento
    consent_id:
      name: consent_id
      in: path
      required: true
      schema:
        type: string
      description: ID do consentimento no formato `urn:{instituição}:{uuid}`
    consent_id_path:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: ID do consentimento
    credit_card_account_id:
      name: credit_card_account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID do cartão de crédito
    credit_type:
      name: credit_type
      in: path
      required: true
      schema:
        type: string
        enum:
          - loans
          - financings
          - unarranged-accounts-overdraft
          - invoice-financings
      description: Tipo de contrato de crédito
    investment_type:
      name: investment_type
      in: path
      required: true
      schema:
        type: string
        enum:
          - bank-fixed-incomes
          - credit-fixed-incomes
          - funds
          - variable-incomes
          - treasure-titles
      description: Tipo de investimento
  responses:
    BadRequest:
      description: Payload inválido — campo faltando, mal formatado ou permissão incompleta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            permissao_invalida:
              summary: Permissão enviada sem agrupamento completo
              value:
                errors:
                  - code: PERMISSAO_INVALIDA
                    title: Permissão inválida
                    detail: >-
                      A permissão 'ACCOUNTS_BALANCES_READ' requer que
                      'ACCOUNTS_READ' também seja enviada no mesmo agrupamento.
                meta:
                  requestDateTime: '2026-05-13T12:00:00Z'
    Unauthorized:
      description: Token inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >-
        Consentimento ausente, não autorizado ou sem a permissão necessária para
        o endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: CONSENTIMENTO_NAO_AUTORIZADO
                title: Consentimento não autorizado
                detail: >-
                  O consentimento está com status AWAITING_AUTHORISATION. Os
                  dados ficam disponíveis somente após confirmação na
                  instituição financeira.
    NotFound:
      description: Recurso não encontrado — user_id, account_id ou consent_id inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: USUARIO_NAO_ENCONTRADO
                title: Usuário não encontrado
                detail: >-
                  Nenhum usuário encontrado para o userId informado. Verifique
                  se o callback de consentimento foi concluído com sucesso.
    TooManyRequests:
      description: Rate limit atingido — aguardar Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos a aguardar antes de tentar novamente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: LIMITE_REQUISICOES_EXCEDIDO
                title: Limite de requisições excedido
                detail: Aguarde e tente novamente.
  schemas:
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Código do erro
              title:
                type: string
                description: Título legível
              detail:
                type: string
                description: Descrição detalhada do problema
        meta:
          type: object
          properties:
            requestDateTime:
              type: string
              format: date-time
    ConsentStatus:
      type: string
      enum:
        - AWAITING_AUTHORISATION
        - AUTHORISED
        - REJECTED
        - REVOKED
      description: >
        Status do consentimento:

        - `AWAITING_AUTHORISATION`: criado, aguardando confirmação do usuário
        (expira em 60 min)

        - `AUTHORISED`: usuário confirmou — dados disponíveis para consulta

        - `REJECTED`: usuário rejeitou ou prazo expirou

        - `REVOKED`: revogado pelo usuário ou pela aplicação
    Organisation:
      type: object
      properties:
        OrganisationName:
          type: string
        OrganisationId:
          type: string
          format: uuid
        LegalEntityName:
          type: string
        RegistrationNumber:
          type: string
          description: CNPJ (14 dígitos)
        ParentOrganisationReference:
          type: string
        AuthorisationServers:
          type: array
          items:
            type: object
            properties:
              AuthorisationServerId:
                type: string
              CustomerFriendlyName:
                type: string
              CustomerFriendlyDescription:
                type: string
              CustomerFriendlyLogoUri:
                type: string
                format: uri
              ApiResources:
                type: array
                items: {}
    CreateConsentRequest:
      type: object
      required:
        - organisationId
        - authorisationServerId
        - consent
      properties:
        organisationId:
          type: string
          format: uuid
          description: Obtido em `GET /organisations`
        authorisationServerId:
          type: string
          description: Obtido em `GET /organisations`
        consent:
          type: object
          required:
            - permissions
          properties:
            loggedUser:
              type: object
              description: CPF (PF) ou CNPJ (PJ) — enviar apenas um
              properties:
                cpf:
                  type: string
                  pattern: ^\d{11}$
                  description: CPF sem máscara (11 dígitos)
                cnpj:
                  type: string
                  pattern: ^\d{14}$
                  description: CNPJ sem máscara (14 dígitos)
            permissions:
              type: array
              items:
                type: string
              description: >-
                Lista de permissões — devem ser enviadas por agrupamento
                completo
            expirationDateTime:
              type: string
              format: date-time
              description: Omitir para consentimento por prazo indeterminado
    CallbackRequest:
      type: object
      required:
        - state
        - code
        - idToken
      properties:
        state:
          type: string
          description: Parâmetro state recebido no retorno da instituição (proteção CSRF)
        code:
          type: string
          description: Código de autorização OAuth recebido no retorno
        idToken:
          type: string
          description: Token de identidade JWT recebido no retorno
    CallbackResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: ID do usuário na plataforma — use em todos os endpoints de dados
        consentId:
          type: string
          description: ID do consentimento no formato urn:{instituição}:{uuid}
        authorisationServerId:
          type: string
        organisationId:
          type: string
          format: uuid
    ConsentDetail:
