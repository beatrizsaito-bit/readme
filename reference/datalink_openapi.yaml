            - CLASSIC_NACIONAL
            - CLASSIC_INTERNACIONAL
            - GOLD
            - PLATINUM
            - INFINITE
            - ELECTRON
            - STANDARD_NACIONAL
            - STANDARD_INTERNACIONAL
            - ELETRONIC
            - BLACK
            - REDESHOP
            - MAESTRO_MASTERCARD_MAESTRO
            - GREEN
            - BLUE
            - BLUEBOX
            - PROFISSIONAL_LIBERAL
            - CHEQUE_ELETRONICO
            - CORPORATIVO
            - EMPRESARIAL
            - COMPRAS
            - BASICO_NACIONAL
            - BASICO_INTERNACIONAL
            - NANQUIM
            - GRAFITE
            - MAIS
            - OUTROS
          example: PLATINUM
        productAdditionalInfo:
          type: string
          description: >
            Informações complementares sobre o tipo de cartão. Obrigatório
