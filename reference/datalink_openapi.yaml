            - DEBITO
          x-enumDescriptions:
            CREDITO: Entrada de crédito na fatura (marcado com "C" no extrato).
            DEBITO: Saída/débito na fatura (marcado com "D" no extrato).
          example: DEBITO
        transactionType:
          type: string
          description: Classificação da transação na fatura.
          enum:
            - PAGAMENTO
            - TARIFA
            - OPERACOES_CREDITO_CONTRATADAS_CARTAO
            - ESTORNO
            - CASHBACK
            - OUTROS
          example: OUTROS
        transactionalAdditionalInfo:
          type: string
          description: >
            Campo livre. **[Restrição]** Obrigatório quando `transactionType`
            for `OUTROS`.
          example: Descrição adicional da transação
        paymentType:
          type: string
          description: >
            Tipo de pagamento. **[Restrição]** Obrigatório quando
            `transactionType` for `PAGAMENTO`.
          enum:
            - A_VISTA
            - A_PRAZO
          example: A_VISTA
        feeType:
          type: string
          description: >
            Tipo de tarifa cobrada. **[Restrição]** Obrigatório quando
            `transactionType` for `TARIFA`.
          enum:
            - ANUIDADE
            - SAQUE_CARTAO_BRASIL
            - SAQUE_CARTAO_EXTERIOR
            - AVALIACAO_EMERGENCIAL_CREDITO
            - EMISSAO_SEGUNDA_VIA
            - TARIFA_PAGAMENTO_CONTAS
            - SMS
            - OUTRA
          example: ANUIDADE
        feeTypeAdditionalInfo:
          type: string
          description: >
            Campo livre. **[Restrição]** Obrigatório quando `feeType` for
            `OUTRA`.
          example: Tarifa especial negociada
        otherCreditsType:
          type: string
          description: >
            Outros tipos de crédito contratados no cartão. **[Restrição]**
            Obrigatório quando `transactionType` for
            `OPERACOES_CREDITO_CONTRATADAS_CARTAO`.
          enum:
            - CREDITO_ROTATIVO
            - PARCELAMENTO_FATURA
            - EMPRESTIMO
            - OUTROS
          example: CREDITO_ROTATIVO
        otherCreditsAdditionalInfo:
          type: string
          description: >
            Campo livre para dados adicionais de outros tipos de crédito.
            **[Restrição]** Obrigatório quando `otherCreditsType` for `OUTROS`.
          example: Crédito especial negociado
        chargeIdentificator:
          type: integer
          description: >
            Número da parcela sendo informada. **[Restrição]** Obrigatório
            quando `paymentType` for `A_PRAZO`.
          example: 2
        chargeNumber:
          type: integer
          description: >
            Quantidade total de parcelas. **[Restrição]** Obrigatório quando
            houver parcelas relacionadas à transação.
          example: 6
        brazilianAmount:
          type: object
          description: >
            Valor da transação em moeda corrente do Brasil (BRL). Em compras
            internacionais, deve ser o valor de `amount` convertido para BRL.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor em BRL com no mínimo 2 e no máximo 4 casas decimais.
              example: '299.9900'
            currency:
              type: string
              description: Moeda conforme ISO-4217. Sempre `BRL` para este campo.
              example: BRL
        amount:
          type: object
          description: >
            Valor original da transação, sem conversão de moeda, independente da
            nacionalidade.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor original com no mínimo 2 e no máximo 4 casas decimais.
              example: '299.9900'
            currency:
              type: string
              description: Moeda original da transação conforme ISO-4217.
              example: BRL
        transactionDateTime:
          type: string
          format: date-time
          description: >
            Data e hora da transação (ISO 8601, UTC, com precisão de
            milissegundos). Segundos e milissegundos podem ser preenchidos com
            zero quando não disponíveis.
          example: '2024-09-05T14:22:03.000Z'
        billPostDate:
          type: string
          format: date
          description: Data em que a transação foi inserida na fatura.
          example: '2024-09-06'
        payeeMCC:
          type: integer
          description: >
            Código de categoria do estabelecimento comercial (MCC — Merchant
            Category Code). Classifica o negócio pelo tipo de bens ou serviços
            fornecidos.
          example: 5999
    CreditContract:
      type: object
      description: Contrato de crédito do usuário via Open Finance.
      required:
        - contractId
        - brandName
        - companyCnpj
        - productType
        - contractAmount
        - currency
        - dueDate
      properties:
        contractId:
          type: string
          format: uuid
          description: Identificador único e imutável do contrato.
          example: 92792126-7ee1-4a6b-a3f8-d4e2c1b5f9a0
        brandName:
          type: string
          description: Nome da marca da instituição credora.
          example: Sib Bank
        companyCnpj:
          type: string
          description: CNPJ da instituição credora (14 dígitos).
          example: '40156018000100'
        productType:
          type: string
          description: Tipo de produto de crédito conforme Open Finance Brasil.
          enum:
            - EMPRESTIMO_CREDITO_PESSOAL_CONSIGNADO
            - EMPRESTIMO_CREDITO_PESSOAL_SEM_CONSIGNACAO
            - EMPRESTIMO_HOME_EQUITY
            - EMPRESTIMO_MICROCREDITO_PRODUTIVO_ORIENTADO
            - EMPRESTIMO_CHEQUE_ESPECIAL
            - EMPRESTIMO_CONTA_GARANTIDA
            - FINANCIAMENTO_AQUISICAO_BENS_VEICULOS_AUTOMOTORES
            - FINANCIAMENTO_AQUISICAO_BENS_OUTROS_BENS
            - FINANCIAMENTO_MICROCREDITO
            - FINANCIAMENTO_RURAL_CUSTEIO
            - FINANCIAMENTO_RURAL_INVESTIMENTO
            - FINANCIAMENTO_IMOBILIARIO_SISTEMA_FINANCEIRO_HABITACAO_SFH
            - FINANCIAMENTO_IMOBILIARIO_SISTEMA_FINANCEIRO_HABITACAO_SFI
          example: EMPRESTIMO_CREDITO_PESSOAL_SEM_CONSIGNACAO
        contractDate:
          type: string
          format: date
          description: Data de assinatura do contrato.
          example: '2023-06-01'
        contractAmount:
          type: string
          description: Valor original do contrato.
          example: '25000.00'
        currency:
          type: string
          description: Moeda do contrato conforme ISO-4217.
          example: BRL
        dueDate:
          type: string
          format: date
          description: Data de vencimento final do contrato.
          example: '2026-06-01'
        instalmentPeriodicity:
          type: string
          description: Periodicidade das parcelas.
          enum:
            - SEMANAL
            - QUINZENAL
            - MENSAL
            - BIMESTRAL
            - TRIMESTRAL
            - SEMESTRAL
            - ANUAL
            - SEM_PERIODICIDADE_REGULAR
          example: MENSAL
        CET:
          type: number
          description: >-
            Custo Efetivo Total anual do contrato (em decimal, ex. 0.3215 =
            32,15% a.a.).
          example: 0.3215
        amortizationScheduled:
          type: string
          description: Sistema de amortização do contrato.
          enum:
            - SAC
            - PRICE
            - SAM
            - SEM_SISTEMA_AMORTIZACAO_REGULAR
            - OUTROS
          example: SAC
    ContractPayments:
      type: object
      description: Pagamentos realizados em um contrato de crédito.
      required:
        - paidInstalments
        - contractOutstandingBalance
        - releasesList
      properties:
        paidInstalments:
          type: integer
          description: Número de parcelas já pagas no contrato.
          example: 12
        contractOutstandingBalance:
          type: string
          description: Saldo devedor atual do contrato.
          example: '13500.00'
        releasesList:
          type: array
          description: Lista de pagamentos realizados.
          items:
            type: object
            properties:
              paymentId:
                type: string
                description: Identificador único do pagamento.
                example: PAY-001-2024
              isOverParcelPayment:
                type: boolean
                description: Indica se o pagamento é uma quitação antecipada de parcelas.
                example: false
              instalmentId:
                type: string
                description: Número da parcela paga.
                example: '12'
              paidDate:
                type: string
                format: date
                description: Data em que o pagamento foi realizado.
                example: '2024-09-05'
              currency:
                type: string
                description: Moeda do pagamento conforme ISO-4217.
                example: BRL
              paidAmount:
                type: string
                description: Valor pago.
                example: '1041.67'
    Investment:
      type: object
      description: Resumo de um investimento do usuário.
      required:
        - investmentId
        - investmentType
        - brandName
        - companyCnpj
        - productName
      properties:
        investmentId:
          type: string
          description: Identificador único do investimento.
          example: INV-001-BFI
        investmentType:
          type: string
          description: Tipo de produto de investimento.
          enum:
            - BANK_FIXED_INCOMES
            - CREDIT_FIXED_INCOMES
            - VARIABLE_INCOMES
            - TREASURE_TITLES
            - FUNDS
          x-enumDescriptions:
            BANK_FIXED_INCOMES: Renda fixa bancária (CDB, LCI, LCA, etc.)
            CREDIT_FIXED_INCOMES: Renda fixa crédito privado (CRI, CRA, Debêntures, etc.)
            VARIABLE_INCOMES: Renda variável (ações, ETFs, BDRs, etc.)
            TREASURE_TITLES: Tesouro Direto
            FUNDS: Fundos de investimento
          example: BANK_FIXED_INCOMES
        brandName:
          type: string
          description: Nome da marca da instituição custodiante.
          example: Sib Bank
        companyCnpj:
          type: string
          description: CNPJ da instituição custodiante (14 dígitos).
          example: '40156018000100'
        isinCode:
          type: string
          description: Código ISIN do ativo, quando aplicável.
          example: BRSIBCDB10001
        productName:
          type: string
          description: Nome comercial do produto de investimento.
          example: CDB Prefixado 120%
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última atualização do registro.
          example: '2024-09-09T18:00:00Z'
    InvestmentDetail:
      allOf:
        - $ref: '#/components/schemas/Investment'
        - type: object
          description: Detalhes de posição de um investimento.
          properties:
            quantity:
              type: string
              description: Quantidade de cotas ou unidades do investimento.
              example: '1.00'
            updatedUnitPrice:
              type: object
              description: Preço unitário atualizado do investimento.
              properties:
                amount:
                  type: string
                  example: '15234.50'
                currency:
                  type: string
                  example: BRL
            grossAmount:
              type: object
              description: Valor bruto do investimento (quantidade × preço unitário).
              properties:
                amount:
                  type: string
                  example: '15234.50'
                currency:
                  type: string
                  example: BRL
            netAmount:
              type: object
              description: Valor líquido do investimento após impostos e taxas.
              properties:
                amount:
                  type: string
                  example: '13499.28'
                currency:
                  type: string
                  example: BRL
            blockedBalance:
              type: object
              description: Saldo bloqueado do investimento.
              properties:
                amount:
                  type: string
                  example: '0.00'
                currency:
                  type: string
                  example: BRL
            purchaseDate:
              type: string
              format: date
              description: Data de aplicação.
              example: '2022-09-01'
            dueDate:
              type: string
              format: date
              description: Data de vencimento do ativo, quando aplicável.
              example: '2025-09-01'
    InvestmentTransaction:
      type: object
      description: Movimentação (aplicação ou resgate) de um investimento.
      required:
        - transactionId
        - investmentType
        - type
        - transactionDate
        - transactionGrossValue
        - transactionNetValue
      properties:
        transactionId:
          type: string
          description: Identificador único da movimentação.
          example: TXN-INV-001
        investmentId:
          type: string
          description: Identificador do investimento relacionado.
          example: INV-001-BFI
        investmentType:
          type: string
          description: Tipo do produto de investimento.
          enum:
            - BANK_FIXED_INCOMES
            - CREDIT_FIXED_INCOMES
            - VARIABLE_INCOMES
            - TREASURE_TITLES
            - FUNDS
          example: BANK_FIXED_INCOMES
        type:
          type: string
          description: Tipo da movimentação.
          enum:
            - APLICACAO
            - RESGATE
            - RESGATE_TOTAL
            - CREDITO
            - DEBITO
          example: APLICACAO
        transactionDate:
          type: string
          format: date
          description: Data da movimentação.
          example: '2024-09-05'
        brokerNoteId:
          type: string
          description: Identificador da nota de corretagem, quando aplicável.
          example: BRK-001
        transactionGrossValue:
          type: object
          description: Valor bruto da movimentação.
          properties:
            amount:
              type: string
              example: '5000.00'
            currency:
              type: string
              example: BRL
        incomeTax:
          type: object
          description: Imposto de renda retido na movimentação.
          properties:
            amount:
              type: string
              example: '0.00'
            currency:
              type: string
              example: BRL
        financialTransactionTax:
          type: object
          description: IOF retido na movimentação.
          properties:
            amount:
              type: string
              example: '0.00'
            currency:
              type: string
              example: BRL
        transactionNetValue:
          type: object
          description: Valor líquido da movimentação após impostos.
          properties:
            amount:
              type: string
              example: '5000.00'
            currency:
              type: string
              example: BRL
        transactionQuantity:
          type: string
          description: Quantidade de cotas movimentadas.
          example: '0.328456'
        transactionUnitPrice:
          type: object
          description: Preço unitário no momento da movimentação.
          properties:
            amount:
              type: string
              example: '15234.50'
            currency:
              type: string
              example: BRL
    IncomeInference:
      type: object
      description: >-
        Inferência de renda do usuário baseada em padrões transacionais Open
        Finance.
      properties:
        inferredIncome:
          type: number
          description: >-
            Valor de renda inferida com base na análise das transações do
            usuário.
          example: 1771.52
        analyzedMonths:
          type: integer
          description: Número de meses analisados para calcular a inferência de renda.
          example: 24
        analyzedTransactions:
          type: integer
          description: Total de transações consideradas na análise.
          example: 58794
    RecurringExpense:
      type: object
      description: Despesa recorrente identificada nas transações do usuário.
      required:
        - description
        - amount
        - frequency
        - confidenceLevel
      properties:
        description:
          type: string
          description: Nome ou descrição da despesa recorrente conforme extrato.
          example: NETFLIX
        amount:
          type: object
          description: Valor recorrente da despesa.
          properties:
            amount:
              type: string
              example: '55.90'
            currency:
              type: string
              example: BRL
        frequency:
          type: string
          description: Frequência da recorrência identificada.
          enum:
            - MENSAL
            - QUINZENAL
            - SEMANAL
            - ANUAL
            - IRREGULAR
          example: MENSAL
        category:
          type: string
          description: Categoria da despesa recorrente.
          enum:
            - ASSINATURA_STREAMING
            - SAUDE_BEM_ESTAR
            - EDUCACAO
            - MORADIA
            - TRANSPORTE
            - SEGUROS
            - TELECOMUNICACOES
            - OUTROS
          example: ASSINATURA_STREAMING
        lastOccurrence:
          type: string
          format: date
          description: Data da última ocorrência identificada.
          example: '2024-09-01'
        confidenceLevel:
          type: string
          description: Nível de confiança da identificação da recorrência.
          enum:
            - HIGH
            - MEDIUM
            - LOW
          example: HIGH
    MonthlyMovement:
