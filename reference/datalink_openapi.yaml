                message: Tenant ou clientId não encontrado
  /api/v1/webhook-events:
    get:
      tags:
        - Eventos de Webhooks
      summary: Listar eventos
      description: >
        Retorna todos os eventos de webhook da organização com suporte a filtros
        por tipo, status e período, além de paginação.
      operationId: listWebhookEvents
      parameters:
        - name: type
          in: query
          required: false
          description: Filtrar por tipo de evento.
          schema:
            type: string
            example: account.balance.updated
        - name: status
          in: query
          required: false
          description: Filtrar por status do evento.
          schema:
            type: string
            enum:
              - pending
              - delivered
              - failed
              - endpoint_disabled
            example: delivered
        - name: from
          in: query
          required: false
          description: 'Data de início do filtro (ISO 8601, UTC). Ex: 2026-02-01T00:00:00Z'
          schema:
            type: string
            format: date-time
            example: '2026-02-01T00:00:00Z'
        - name: to
          in: query
          required: false
          description: Data de fim do filtro (ISO 8601, UTC).
          schema:
            type: string
            format: date-time
            example: '2026-02-28T23:59:59Z'
        - name: page
          in: query
          required: false
          description: Número da página.
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Itens por página. Máximo 100.
          schema:
            type: integer
            default: 25
            example: 25
      responses:
