        creditCardNetwork:
          type: string
          description: Bandeira do cartão de crédito (instituidor do arranjo de pagamento).
          enum:
            - VISA
            - MASTERCARD
            - AMERICAN_EXPRESS
            - DINERS_CLUB
            - HIPERCARD
            - BANDEIRA_PROPRIA
            - CHEQUE_ELETRONICO
            - ELO
            - OUTRAS
          example: MASTERCARD
        networkAdditionalInfo:
          type: string
          description: >
            Texto livre para especificar a bandeira quando `creditCardNetwork`
            for `OUTRAS`.
          example: Bandeira regional XYZ
        paymentMethod:
          type: array
