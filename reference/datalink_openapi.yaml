components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Organisation:
      type: object
      description: Instituição financeira participante do Open Finance Brasil.
      properties:
        OrganisationName:
          type: string
          description: Nome comercial da instituição financeira.
          example: BCO BMG S.A.
        OrganisationId:
          type: string
          format: uuid
          description: Identificador único da organização no diretório Open Finance.
          example: 4ae2cefb-e3c1-5624-9448-b3aa4777c539
        LegalEntityName:
          type: string
          description: Razão social da instituição conforme registro na Receita Federal.
          example: BANCO BMG S.A.
        RegistrationNumber:
          type: string
          description: CNPJ da instituição (apenas dígitos, 14 caracteres).
          example: '61186680000174'
        ParentOrganisationReference:
          type: string
          description: >
            Referência à organização pai, quando a instituição faz parte de um
            conglomerado financeiro. Retorna string vazia quando não aplicável.
          example: ''
        AuthorisationServers:
          type: array
          description: Lista de servidores de autorização disponíveis para a instituição.
          items:
            $ref: '#/components/schemas/AuthorisationServer'
    AuthorisationServer:
      type: object
      description: Servidor de autorização OpenID Connect da instituição financeira.
      properties:
        AuthorisationServerId:
          type: string
          format: uuid
          description: Identificador único do servidor de autorização.
          example: e70bc5a2-9b70-40f1-a3bb-7e6f41695c52
        CustomerFriendlyName:
          type: string
          description: >-
            Nome exibível ao usuário final para identificar a instituição no
            fluxo de consentimento.
          example: BANCO BMG
        CustomerFriendlyDescription:
          type: string
          description: >-
            Descrição legível do servidor de autorização. Pode indicar ambiente
            (ex.: sandbox, produção).
          example: Auth Server SBX
        CustomerFriendlyLogoUri:
          type: string
          format: uri
          description: >-
            URL do logotipo da instituição para exibição no widget de
            consentimento.
          example: >-
            https://www.bancobmg.com.br/lumis-theme/br/com/bmg/portal/theme/bmg-portal/img/logo.svg
        OpenIDDiscoveryDocument:
          type: string
          format: uri
          description: >
            URL do documento de descoberta OpenID Connect (well-known). Contém
            os endpoints de autorização, token e JWKS da instituição.
          example: >-
            https://api-openfinance-dev.bancobmg.com.br/of-auth/realms/bmg-sbx/.well-known/openid-configuration
        Flags:
          type: object
          description: >
            Mapa de capacidades suportadas pelo servidor de autorização. As
            chaves indicam a funcionalidade e os valores são arrays de strings
            confirmando o suporte.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            Suporta Contas PF:
              - Suporta Contas PF
            Suporta Contas PJ:
              - Suporta Contas PJ
        ApiResources:
          type: array
          description: Lista de famílias de APIs disponíveis para esta instituição.
          items:
            $ref: '#/components/schemas/ApiResource'
    ApiResource:
      type: object
      description: >-
        Recurso de API disponível para uma instituição participante do Open
        Finance.
      properties:
        ApiFamilyType:
          type: string
          description: Tipo de família de API Open Finance disponível na instituição.
          enum:
            - accounts
            - consents
            - credit-cards-accounts
            - customers-personal
            - customers-business
            - loans
            - bank-fixed-incomes
            - enrollments
            - resources
            - payments-consents
            - payments-pix
            - payments-pix-recurring-payments
            - payments-pix-recurring-payments-automatic
            - payments-recurring-consents
            - payments-recurring-consents-automatic
            - credit-portability
            - payroll-credit-portability
            - opendata-accounts_personal-accounts
            - opendata-creditcards_personal-credit-cards
            - opendata-creditcards_business-credit-cards
            - opendata-loans_business-loans
            - opendata-financings_business-financings
            - opendata-insurance_personals
            - channels_electronic-channels
            - channels_phone-channels
          example: accounts
        ApiVersion:
          type: string
          description: >-
            Versão da especificação Open Finance implementada pela instituição
            para esta família de API.
          example: 2.4.2
        ApiDiscoveryEndpoints:
          type: array
          description: >-
            Lista de URLs dos endpoints disponíveis para esta família de API na
            instituição.
          items:
            type: string
            format: uri
          example:
            - >-
              https://api-openfinance-dev-m.bancobmg.com.br/open-banking/accounts/v2/accounts
            - >-
              https://api-openfinance-dev-m.bancobmg.com.br/open-banking/accounts/v2/accounts/{accountId}/transactions
        Status:
          type: string
          description: Status de disponibilidade do recurso de API na instituição.
          enum:
            - Active
            - Inactive
            - Deprecated
          example: Active
    CreateConsentRequest:
      type: object
      required:
        - organisationId
        - authorisationServerId
        - consent
      properties:
        organisationId:
          type: string
          format: uuid
          description: >
            Identificador único da organização (instituição financeira) onde o
            consentimento será criado. Obtido no endpoint de Instituições
            participantes.
          example: 74e929d9-33b6-4d85-8ba7-c146c867a817
        authorisationServerId:
          type: string
          format: uuid
          description: >
            Identificador do servidor de autorização da instituição. Obtido no
            campo AuthorisationServerId dentro de AuthorisationServers no
            endpoint de Instituições participantes.
          example: c8f0bf49-4744-4933-8960-7add6e590841
        consent:
          type: object
          required:
            - loggedUser
            - permissions
          description: Objeto com os dados do usuário e as permissões solicitadas.
          properties:
            loggedUser:
              type: object
              description: >
                Identificação do usuário para o qual o consentimento será
                criado. Informe `cpf` para Pessoa Física ou `cnpj` para Pessoa
                Jurídica.
              oneOf:
                - required:
                    - cpf
                  properties:
                    cpf:
                      type: string
                      description: >-
                        CPF do usuário pessoa física (apenas dígitos, 11
                        caracteres).
                      pattern: ^\d{11}$
                      example: '12345678909'
                - required:
                    - cnpj
                  properties:
                    cnpj:
                      type: string
                      description: >-
                        CNPJ do usuário pessoa jurídica (apenas dígitos, 14
                        caracteres).
                      pattern: ^\d{14}$
                      example: '11222333000181'
            permissions:
              type: array
              description: >
                Lista de permissões de acesso a dados solicitadas para o
                consentimento. Deve incluir ao menos uma permissão. Algumas
                permissões possuem dependência entre si (ex.:
                `ACCOUNTS_BALANCES_READ` requer `ACCOUNTS_READ`).
              minItems: 1
              items:
                type: string
                enum:
                  - RESOURCES_READ
                  - CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ
                  - CUSTOMERS_PERSONAL_ADITTIONALINFO_READ
                  - CUSTOMERS_BUSINESS_IDENTIFICATIONS_READ
                  - CUSTOMERS_BUSINESS_ADITTIONALINFO_READ
                  - ACCOUNTS_READ
                  - ACCOUNTS_BALANCES_READ
                  - ACCOUNTS_OVERDRAFT_LIMITS_READ
                  - ACCOUNTS_TRANSACTIONS_READ
                  - CREDIT_CARDS_ACCOUNTS_READ
                  - CREDIT_CARDS_ACCOUNTS_LIMITS_READ
                  - CREDIT_CARDS_ACCOUNTS_TRANSACTIONS_READ
                  - CREDIT_CARDS_ACCOUNTS_BILLS_READ
                  - CREDIT_CARDS_ACCOUNTS_BILLS_TRANSACTIONS_READ
                  - LOANS_READ
                  - LOANS_WARRANTIES_READ
                  - LOANS_SCHEDULED_INSTALMENTS_READ
                  - LOANS_PAYMENTS_READ
                  - FINANCINGS_READ
                  - FINANCINGS_WARRANTIES_READ
                  - FINANCINGS_SCHEDULED_INSTALMENTS_READ
                  - FINANCINGS_PAYMENTS_READ
                  - UNARRANGED_ACCOUNTS_OVERDRAFT_READ
                  - UNARRANGED_ACCOUNTS_OVERDRAFT_WARRANTIES_READ
                  - UNARRANGED_ACCOUNTS_OVERDRAFT_SCHEDULED_INSTALMENTS_READ
                  - UNARRANGED_ACCOUNTS_OVERDRAFT_PAYMENTS_READ
                  - INVOICE_FINANCINGS_READ
                  - INVOICE_FINANCINGS_WARRANTIES_READ
                  - INVOICE_FINANCINGS_SCHEDULED_INSTALMENTS_READ
                  - INVOICE_FINANCINGS_PAYMENTS_READ
                  - BANK_FIXED_INCOMES_READ
                  - CREDIT_FIXED_INCOMES_READ
                  - FUNDS_READ
                  - VARIABLE_INCOMES_READ
                  - TREASURE_TITLES_READ
    ConsentResponse:
      type: object
      description: Resposta da criação de um consentimento Open Finance.
      properties:
        consentId:
          type: string
          description: >
            Identificador único do consentimento gerado, no formato URN.
            Utilizado em todas as chamadas subsequentes de dados agregados.
          example: >-
            urn:datalink:74e929d9-33b6-4d85-8ba7-c146c867a817:3fa85f64-5717-4562-b3fc-2c963f66afa6
        status:
          type: string
          description: Status atual do consentimento.
          enum:
            - AWAITING_AUTHORISATION
            - AUTHORISED
            - REJECTED
            - REVOKED
          example: AWAITING_AUTHORISATION
        redirectUrl:
          type: string
          format: uri
          description: >
            URL para redirecionar o usuário final à tela de autorização na
            instituição financeira. Válida apenas quando o status é
            `AWAITING_AUTHORISATION`.
          example: >-
            https://auth.bancobmg.com.br/of-auth/realms/bmg/protocol/openid-connect/auth?client_id=datalink&redirect_uri=https%3A%2F%2Fcallback.datalink.com.br&response_type=code&scope=openid
        creationDateTime:
          type: string
          format: date-time
          description: Data e hora de criação do consentimento (ISO 8601, UTC).
          example: '2026-05-20T10:30:00Z'
        expirationDateTime:
          type: string
          format: date-time
          description: >
            Data e hora de expiração do consentimento. O usuário deve autorizar
            o acesso antes deste prazo para que o consentimento seja ativado.
          example: '2026-05-20T10:45:00Z'
        permissions:
          type: array
          description: Lista de permissões solicitadas no consentimento.
          items:
            type: string
          example:
            - RESOURCES_READ
            - CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ
            - ACCOUNTS_READ
            - ACCOUNTS_BALANCES_READ
            - ACCOUNTS_TRANSACTIONS_READ
    ConsentListResponse:
      type: object
      description: Resposta paginada da listagem de consentimentos.
      properties:
        data:
          type: array
          description: Lista de consentimentos retornados.
          items:
            $ref: '#/components/schemas/ConsentSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ConsentSummary:
      type: object
      description: Resumo de um consentimento na listagem.
      properties:
        consentId:
          type: string
          description: Identificador único do consentimento no formato URN.
          example: >-
            urn:datalink:74e929d9-33b6-4d85-8ba7-c146c867a817:3fa85f64-5717-4562-b3fc-2c963f66afa6
        status:
          type: string
          description: Status atual do consentimento.
          enum:
            - AUTHORISED
            - AWAITING_AUTHORISATION
            - REJECTED
            - REVOKED
          example: AUTHORISED
        creationDateTime:
          type: string
          format: date-time
          description: Data e hora de criação do consentimento (ISO 8601, UTC).
          example: '2026-05-18T09:00:00Z'
        expirationDateTime:
          type: string
          format: date-time
          description: Data e hora de expiração do consentimento (ISO 8601, UTC).
          example: '2027-05-18T09:00:00Z'
        permissions:
          type: array
          description: Lista de permissões autorizadas no consentimento.
          items:
            type: string
          example:
            - RESOURCES_READ
            - ACCOUNTS_READ
            - ACCOUNTS_BALANCES_READ
        loggedUser:
          type: object
          description: Documento do usuário vinculado ao consentimento.
          properties:
            cpf:
              type: string
              description: >-
                CPF do usuário pessoa física (apenas dígitos, 11 caracteres).
                Presente quando o consentimento for de PF.
              example: '12345678909'
            cnpj:
              type: string
              description: >-
                CNPJ do usuário pessoa jurídica (apenas dígitos, 14 caracteres).
                Presente quando o consentimento for de PJ.
              example: '11222333000181'
    Pagination:
      type: object
      description: Metadados de paginação da resposta.
      properties:
        page:
          type: integer
          description: Número da página atual.
          example: 1
        limit:
          type: integer
          description: Quantidade de registros por página.
          example: 20
        total:
          type: integer
          description: Total de registros encontrados.
          example: 2
        totalPages:
          type: integer
          description: Total de páginas disponíveis.
          example: 1
    UserConsent:
      type: object
      description: Consentimento Open Finance vinculado a um usuário.
      required:
        - userId
        - consentId
        - creationDateTime
        - status
        - statusUpdateDateTime
        - permissions
        - organisationId
        - authorisationServerId
      properties:
        userId:
          type: string
          format: uuid
          description: Identificador único do usuário na plataforma DataLink.
          example: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
        consentId:
          type: string
          pattern: >-
            ^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
          description: >
            Identificador único do consentimento no formato URN (Uniform
            Resource Name), conforme RFC 8141. Composto por namespace `urn`,
            identificador da instituição transmissora e identificador específico
            do consentimento.
          example: urn:raidiambank:23f1a40c-6c9e-4c76-998c-d33d7c546818
        creationDateTime:
          type: string
          format: date-time
          pattern: >-
            ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$
          description: >
            Data e hora de criação do consentimento (ISO 8601, UTC). Conforme
            especificação RFC-3339, sempre em timezone UTC.
          example: '2025-02-14T11:28:11Z'
        status:
          type: string
          description: Status atual do consentimento.
          enum:
            - AUTHORISED
            - AWAITING_AUTHORISATION
            - REJECTED
            - REVOKED
          example: AUTHORISED
        statusUpdateDateTime:
          type: string
          format: date-time
          pattern: >-
            ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$
          description: >
            Data e hora da última atualização de status do consentimento (ISO
            8601, UTC). Conforme especificação RFC-3339, sempre em timezone UTC.
          example: '2025-02-14T11:29:41Z'
        permissions:
          type: array
          minItems: 1
          description: >
            Lista de permissões de acesso concedidas no escopo do consentimento,
            conforme Open Finance Brasil. O array não deve conter itens
            duplicados.
          items:
            type: string
            enum:
              - RESOURCES_READ
              - CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ
              - CUSTOMERS_PERSONAL_ADITTIONALINFO_READ
              - CUSTOMERS_BUSINESS_IDENTIFICATIONS_READ
              - CUSTOMERS_BUSINESS_ADITTIONALINFO_READ
              - ACCOUNTS_READ
              - ACCOUNTS_BALANCES_READ
              - ACCOUNTS_OVERDRAFT_LIMITS_READ
              - ACCOUNTS_TRANSACTIONS_READ
              - CREDIT_CARDS_ACCOUNTS_READ
              - CREDIT_CARDS_ACCOUNTS_LIMITS_READ
              - CREDIT_CARDS_ACCOUNTS_TRANSACTIONS_READ
              - CREDIT_CARDS_ACCOUNTS_BILLS_READ
              - CREDIT_CARDS_ACCOUNTS_BILLS_TRANSACTIONS_READ
              - LOANS_READ
              - LOANS_WARRANTIES_READ
              - LOANS_SCHEDULED_INSTALMENTS_READ
              - LOANS_PAYMENTS_READ
              - FINANCINGS_READ
              - FINANCINGS_WARRANTIES_READ
              - FINANCINGS_SCHEDULED_INSTALMENTS_READ
              - FINANCINGS_PAYMENTS_READ
              - UNARRANGED_ACCOUNTS_OVERDRAFT_READ
              - UNARRANGED_ACCOUNTS_OVERDRAFT_WARRANTIES_READ
              - UNARRANGED_ACCOUNTS_OVERDRAFT_SCHEDULED_INSTALMENTS_READ
              - UNARRANGED_ACCOUNTS_OVERDRAFT_PAYMENTS_READ
              - INVOICE_FINANCINGS_READ
              - INVOICE_FINANCINGS_WARRANTIES_READ
              - INVOICE_FINANCINGS_SCHEDULED_INSTALMENTS_READ
              - INVOICE_FINANCINGS_PAYMENTS_READ
              - BANK_FIXED_INCOMES_READ
              - CREDIT_FIXED_INCOMES_READ
              - FUNDS_READ
              - VARIABLE_INCOMES_READ
              - TREASURE_TITLES_READ
          example:
            - RESOURCES_READ
            - ACCOUNTS_READ
            - ACCOUNTS_BALANCES_READ
        expirationDateTime:
          type: string
          format: date-time
          pattern: >-
            ^(\d{4})-(1[0-2]|0?[1-9])-(3[01]|[12][0-9]|0?[1-9])T(?:[01]\d|2[0123]):(?:[012345]\d):(?:[012345]\d)Z$
          description: >
            Data e hora de expiração do consentimento (ISO 8601, UTC).
            Obrigatório quando houver validade determinada. Não deve ser
            preenchido em consentimentos com prazo indeterminado.
          example: '2027-05-21T08:30:00Z'
        organisationId:
          type: string
          format: uuid
          description: Identificador da instituição financeira vinculada ao consentimento.
          example: 74e929d9-33b6-4d85-8ba7-c146c867a817
        authorisationServerId:
          type: string
          format: uuid
          description: Identificador do servidor de autorização da instituição.
          example: c8f0bf49-4744-4933-8960-7add6e590841
        rejection:
          type: object
          description: >
            Presente apenas quando `status` é `REJECTED`. Detalha o motivo e o
            responsável pela rejeição do consentimento.
          required:
            - rejectedBy
            - reason
          properties:
            rejectedBy:
              type: string
              description: Identifica o agente responsável pela rejeição do consentimento.
              enum:
                - USER
                - ASPSP
                - TPP
              x-enumDescriptions:
                USER: Usuário
                ASPSP: Instituição transmissora
                TPP: Instituição receptora
              example: USER
            reason:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: Código que descreve o motivo da rejeição.
                  enum:
                    - CONSENT_EXPIRED
                    - CUSTOMER_MANUALLY_REJECTED
                    - CUSTOMER_MANUALLY_REVOKED
                    - CONSENT_MAX_DATE_REACHED
                    - CONSENT_TECHNICAL_ISSUE
                    - INTERNAL_SECURITY_REASON
                  x-enumDescriptions:
                    CONSENT_EXPIRED: Consentimento ultrapassou o tempo limite para autorização.
                    CUSTOMER_MANUALLY_REJECTED: Cliente rejeitou o consentimento manualmente.
                    CUSTOMER_MANUALLY_REVOKED: Cliente revogou o consentimento após autorização.
                    CONSENT_MAX_DATE_REACHED: >-
                      Consentimento ultrapassou o tempo limite de
                      compartilhamento.
                    CONSENT_TECHNICAL_ISSUE: >-
                      Falha técnica que impossibilita o uso do consentimento
                      (ex. falha na troca do AuthCode pelo AccessToken no Hybrid
                      Flow).
                    INTERNAL_SECURITY_REASON: >-
                      Rejeição por políticas de segurança da instituição
                      transmissora.
                  example: CUSTOMER_MANUALLY_REVOKED
                additionalInformation:
                  type: string
                  pattern: ^[^\s](.*[^\s])?$
                  description: >
                    Informações adicionais sobre a rejeição, a critério da
                    instituição transmissora.
                  example: Tempo de confirmação da múltipla alçada excedido.
    NotificationChannel:
      type: object
      description: Canal de notificação configurado para o tenant.
      properties:
        type:
          type: string
          description: Tipo do canal de notificação.
          enum:
            - webhook
            - slack
            - email
            - sms
          example: webhook
        value:
          type: string
          description: >
            Valor do canal conforme o tipo: URL para `webhook` e `slack`,
            endereço de e-mail para `email`, número com DDI para `sms`.
          example: https://prod.empresa.com/webhooks/lina
        enable:
          type: boolean
          description: Indica se o canal está ativo.
          default: true
          example: true
        secret:
          type: string
          nullable: true
          description: Secret de assinatura. Aplicável apenas ao tipo `webhook`.
          example: null
    NotificationChannelsResponse:
      type: object
      description: Resposta com os canais de notificação do tenant.
      properties:
        tenantId:
          type: string
          description: Identificador único do tenant.
          example: tenant_id
        channels:
          type: array
          description: Lista de canais de notificação configurados.
          items:
            $ref: '#/components/schemas/NotificationChannel'
        createdAt:
          type: string
          format: date-time
          description: Data e hora de criação do registro (ISO 8601, UTC).
          example: '2025-03-20T19:22:17.646Z'
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última atualização (ISO 8601, UTC).
          example: '2025-03-20T20:12:11.715Z'
    NotificationChannelsRequest:
      type: object
      required:
        - tenantId
      description: Payload para criação ou atualização dos canais de notificação.
      properties:
        tenantId:
          type: string
          description: Identificador único do tenant.
          example: alex-teste
        channels:
          type: array
          description: Lista de canais a criar ou atualizar.
          items:
            $ref: '#/components/schemas/NotificationChannel'
    WebhookConfig:
      type: object
      description: Configuração de um webhook registrado para o tenant.
      properties:
        clientId:
          type: string
          description: Client ID Keycloak associado ao webhook.
          example: go-assets-prod
        value:
          type: string
          format: uri
          description: URL HTTPS do endpoint que receberá os eventos.
          example: https://prod.empresa.com/webhooks/lina
        enable:
          type: boolean
          description: Indica se o webhook está ativo.
          default: true
          example: true
        secret:
          type: string
          description: Secret usado para verificar a assinatura `X-Lina-Signature`.
          example: 88bccb89-0674-4e2e-a4f7-2ea2bf3fb2e2
        consecutiveFailures:
          type: integer
          description: >-
            Número de eventos consecutivos que falharam em todas as tentativas
            de entrega.
          default: 0
          example: 0
        previousSecret:
          type: string
          description: >
            Secret anterior, válido por 24h após a rotação. Presente apenas
            imediatamente após rotacionar o secret.
          example: whsec_anterior...
        previousSecretExpiresAt:
          type: string
          format: date-time
          description: >-
            Data e hora de expiração do secret anterior. Presente apenas após
            rotação.
          example: '2026-05-21T10:00:00Z'
        disabledAt:
          type: string
          format: date-time
          description: >-
            Data e hora em que o webhook foi desabilitado automaticamente.
            Presente apenas se desabilitado.
          example: '2026-05-19T08:00:00Z'
        disabledReason:
          type: string
          description: >-
            Motivo pelo qual o webhook foi desabilitado automaticamente.
            Presente apenas se desabilitado.
          example: Too many consecutive failures
    WebhookUpsertRequest:
      type: object
      required:
        - value
        - enable
      description: Payload para criação ou atualização de um webhook.
      properties:
        value:
          type: string
          format: uri
          description: URL HTTPS do endpoint que receberá os eventos.
          example: https://prod.empresa.com/webhooks/lina
        enable:
          type: boolean
          description: Define se o webhook estará ativo após a operação.
          example: true
        secret:
          type: string
          description: >-
            Secret personalizado para assinatura. Se omitido, é gerado
            automaticamente.
          example: meu-secret-customizado
    WebhookAttempt:
      type: object
      description: Tentativa de entrega de um evento de webhook.
      properties:
        number:
          type: integer
          description: Número sequencial da tentativa.
          example: 1
        at:
          type: string
          format: date-time
          description: Data e hora em que a tentativa foi realizada (ISO 8601, UTC).
          example: '2026-02-27T14:15:13Z'
        statusCode:
          type: integer
          description: HTTP status code retornado pelo endpoint do cliente.
          example: 200
        responseBody:
          type: string
          description: Corpo da resposta retornada pelo endpoint do cliente.
          example: OK
        durationMs:
          type: integer
          description: Tempo de resposta do endpoint em milissegundos.
          example: 145
    WebhookEvent:
      type: object
      description: Evento de webhook registrado na plataforma.
      properties:
        _id:
          type: string
          description: Identificador único do evento no formato `evt_`.
          example: evt_019c9f741f617007ba5ad5ef22f6b47b
        type:
          type: string
          description: Tipo do evento disparado.
          example: account.balance.updated
        tenantId:
          type: string
          description: Identificador do tenant ao qual o evento pertence.
          example: go-assets
        clientId:
          type: string
          description: Client ID Keycloak do webhook de destino.
          example: go-assets-prod
        created:
          type: integer
          description: Timestamp Unix (segundos) da criação do evento.
          example: 1772201713
        apiVersion:
          type: string
          description: Versão da API que gerou o evento.
          example: '2025-02-01'
        status:
          type: string
          description: Status atual de entrega do evento.
          enum:
            - pending
            - delivered
            - failed
            - endpoint_disabled
          example: delivered
        endpoint:
          type: string
          format: uri
          description: URL do endpoint de destino do evento.
          example: https://prod.empresa.com/webhooks/lina
        attempts:
          type: array
          description: Lista de tentativas de entrega do evento.
          items:
            $ref: '#/components/schemas/WebhookAttempt'
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Data e hora da próxima tentativa programada. `null` quando não há
            reenvio pendente.
          example: null
        createdAt:
          type: string
          format: date-time
          description: Data e hora de criação do evento (ISO 8601, UTC).
          example: '2026-02-27T14:15:13.502Z'
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última atualização do evento (ISO 8601, UTC).
          example: '2026-02-27T14:15:13Z'
        expiresAt:
          type: string
          format: date-time
          description: Data e hora de expiração do registro do evento (ISO 8601, UTC).
          example: '2026-03-29T14:15:13.502Z'
    WebhookEventDetail:
      allOf:
        - $ref: '#/components/schemas/WebhookEvent'
        - type: object
          properties:
            payload:
              type: string
              description: >-
                Payload JSON completo enviado ao endpoint no momento do disparo
                do evento.
              example: '{"id":"evt_019c9f74...","eventType":"account.balance.updated"}'
    WebhookEventsMeta:
      type: object
      description: Metadados de paginação da listagem de eventos.
      properties:
        total:
          type: integer
          description: Total de eventos encontrados com os filtros aplicados.
          example: 42
        page:
          type: integer
          description: Página atual.
          example: 1
        limit:
          type: integer
          description: Itens retornados por página.
          example: 25
    Account:
      type: object
      description: Conta bancária do usuário retornada via Open Finance.
      required:
        - accountId
        - authorisationServerId
        - brandName
        - companyCnpj
        - compeCode
        - number
        - checkDigit
        - organisationId
        - type
        - updatedAt
        - details
        - balance
      properties:
        accountId:
          type: string
          format: uuid
          description: >-
            Identificador único e imutável da conta do cliente na instituição
            financeira.
          example: 291e5a29-49ed-401f-a583-193caa7acddd
        authorisationServerId:
          type: string
          format: uuid
          description: >
            Identificador do servidor de autorização da instituição financeira.
            Obtido no endpoint de Instituições participantes.
          example: c8f0bf49-4744-4933-8960-7add6e590841
        brandName:
          type: string
          description: Nome da marca reportada pelo participante no Open Finance.
          example: Sib Bank
        companyCnpj:
          type: string
          description: >-
            CNPJ completo da instituição responsável pelo cadastro da conta (14
            dígitos).
          example: '40156018000100'
        compeCode:
          type: string
          description: >-
            Código identificador da instituição atribuído pelo Banco Central do
            Brasil (COMPE).
          example: '123'
        branchCode:
          type: string
          description: >
            Código da agência detentora da conta.

            **[Restrição]** Obrigatório quando o campo `type` for
            `CONTA_DEPOSITO_A_VISTA` ou `CONTA_POUPANCA`. Não aplicável para
            `CONTA_PAGAMENTO_PRE_PAGA`.
          example: '6272'
        number:
          type: string
          description: Número da conta.
          example: '11188222'
        checkDigit:
          type: string
          description: Dígito verificador da conta.
          example: '4'
        organisationId:
          type: string
          format: uuid
          description: >-
            Identificador da organização (instituição financeira) vinculada à
            conta.
          example: 74e929d9-33b6-4d85-8ba7-c146c867a817
        type:
          type: string
          description: >
            Tipo da conta conforme modalidades previstas pela Resolução 4.753 do
            Banco Central.
          enum:
            - CONTA_DEPOSITO_A_VISTA
            - CONTA_POUPANCA
            - CONTA_PAGAMENTO_PRE_PAGA
          x-enumDescriptions:
            CONTA_DEPOSITO_A_VISTA: >-
              Conta corrente — tipo mais comum, permite depósitos, saques e
              transferências sem restrições.
            CONTA_POUPANCA: >-
              Conta poupança — criada para estimular a economia, com rendimento
              sobre saldo mantido.
            CONTA_PAGAMENTO_PRE_PAGA: >-
              Conta de pagamento pré-paga — conforme CIRCULAR Nº 3.680 do Banco
              Central do Brasil.
          example: CONTA_POUPANCA
        updatedAt:
          type: string
          format: date-time
          description: >-
            Data e hora da última atualização do registro da conta (ISO 8601,
            UTC).
          example: '2024-09-09T18:00:46.349Z'
        details:
          $ref: '#/components/schemas/AccountDetails'
        balance:
          $ref: '#/components/schemas/AccountBalance'
        overdraftLimits:
          $ref: '#/components/schemas/OverdraftLimits'
    AccountDetails:
      type: object
      description: Detalhes complementares da conta bancária.
      required:
        - compeCode
        - number
        - checkDigit
        - type
        - subtype
        - currency
      properties:
        compeCode:
          type: string
          description: >
            Código identificador da instituição atribuído pelo Banco Central do
            Brasil às instituições participantes do STR (Sistema de
            Transferência de Reservas).
          example: '001'
        branchCode:
          type: string
          description: >
            Código da agência detentora da conta.

            **[Restrição]** Obrigatório quando o campo `type` for diferente de
            `CONTA_PAGAMENTO_PRE_PAGA`.
          example: '0001'
        number:
          type: string
          description: Número da conta.
          example: '123456'
        checkDigit:
          type: string
          description: Dígito verificador da conta.
          example: '7'
        type:
          type: string
          description: >
            Tipo da conta conforme modalidades tradicionais previstas pela
            Resolução 4.753 do Banco Central, não contemplando contas virtuais.
          enum:
            - CONTA_DEPOSITO_A_VISTA
            - CONTA_POUPANCA
            - CONTA_PAGAMENTO_PRE_PAGA
          x-enumDescriptions:
            CONTA_DEPOSITO_A_VISTA: >-
              Conta corrente — o dinheiro fica à disposição do titular para uso
              imediato.
            CONTA_POUPANCA: >-
              Conta poupança — estimula a economia com rendimento sobre o saldo
              mantido.
            CONTA_PAGAMENTO_PRE_PAGA: >-
              Conta de pagamento pré-paga — destinada à execução de transações
              de pagamento, conforme CIRCULAR Nº 3.680 do BCB (2013).
          example: CONTA_DEPOSITO_A_VISTA
        subtype:
          type: string
          description: |
            Subtipo de conta conforme a titularidade.
          enum:
            - INDIVIDUAL
            - CONJUNTA_SIMPLES
            - CONJUNTA_SOLIDARIA
          x-enumDescriptions:
            INDIVIDUAL: Conta com um único titular.
            CONJUNTA_SIMPLES: >-
              Conta conjunta onde as movimentações só podem ser realizadas
              mediante autorização de todos os titulares.
            CONJUNTA_SOLIDARIA: >-
              Conta conjunta onde qualquer titular pode realizar movimentações
              de forma isolada.
          example: INDIVIDUAL
        currency:
          type: string
          description: >
            Moeda dos saldos da conta, conforme modelo ISO-4217. Todos os saldos
            informados estão representados com a moeda vigente do Brasil.
          example: BRL
    MonetaryAmount:
      type: object
      description: Valor monetário com moeda associada.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: >
            Valor monetário com até 2 casas decimais, representado como string
            para preservar precisão. Ex: "5200.50".
          example: '5200.50'
        currency:
          type: string
          description: 'Moeda do valor conforme ISO-4217. Ex: BRL.'
          example: BRL
    AccountBalance:
      type: object
      description: Saldos da conta bancária.
      required:
        - availableAmount
        - blockedAmount
        - automaticallyInvestedAmount
        - updateDateTime
      properties:
        availableAmount:
          type: object
          description: Saldo disponível para utilização pelo cliente.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor do saldo disponível.
              example: '41233.07'
            currency:
              type: string
              description: Moeda conforme ISO-4217.
              example: BRL
        blockedAmount:
          type: object
          description: Saldo bloqueado, não disponível para uso imediato.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor do saldo bloqueado.
              example: '999.99'
            currency:
              type: string
              description: Moeda conforme ISO-4217.
              example: BRL
        automaticallyInvestedAmount:
          type: object
          description: Saldo disponível com aplicação automática vinculada à conta.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor do saldo aplicado automaticamente.
              example: '15000.00'
            currency:
              type: string
              description: Moeda conforme ISO-4217.
              example: BRL
        updateDateTime:
          type: string
          format: date-time
          description: >
            Data e hora da última atualização dos saldos (ISO 8601, UTC).
            Reflete o momento em que a instituição capturou os dados. Quando não
            há uma data precisa disponível, deve ser preenchida com a data mais
            recente conhecida.
          example: '2024-09-09T10:53:52Z'
    OverdraftLimits:
      type: object
      description: Limites de cheque especial e cheque especial não contratado da conta.
      required:
        - overdraftContractedLimit
        - overdraftUsedLimit
        - unarrangedOverdraftAmount
      properties:
        overdraftContractedLimit:
          allOf:
            - $ref: '#/components/schemas/MonetaryAmount'
          description: Limite contratado de cheque especial disponível para a conta.
        overdraftUsedLimit:
          allOf:
            - $ref: '#/components/schemas/MonetaryAmount'
          description: Valor utilizado do limite de cheque especial.
        unarrangedOverdraftAmount:
          allOf:
            - $ref: '#/components/schemas/MonetaryAmount'
          description: >
            Valor de cheque especial não contratado utilizado — saldo negativo
            além do limite de cheque especial contratado.
    AccountTransaction:
      type: object
      description: Transação realizada ou lançamento futuro de uma conta bancária.
      required:
        - transactionId
        - completedAuthorisedPaymentType
        - creditDebitType
        - transactionName
        - type
        - transactionAmount
        - transactionDateTime
      properties:
        transactionId:
          type: string
          description: >
            Identificador único da transação prestado pela instituição detentora
            da conta. Deve ser imutável após o status `TRANSACAO_EFETIVADA`,
            conforme tabela de imutabilidade da API de Contas Open Finance.
          example: TXN-001-20240909
        completedAuthorisedPaymentType:
          type: string
          description: Indicador do status de efetivação da transação.
          enum:
            - TRANSACAO_EFETIVADA
            - LANCAMENTO_FUTURO
            - TRANSACAO_PROCESSANDO
          x-enumDescriptions:
            TRANSACAO_EFETIVADA: Transação concluída — o transactionId torna-se imutável.
            LANCAMENTO_FUTURO: >-
              Transação será efetivada em momento futuro — o transactionId pode
              mudar.
            TRANSACAO_PROCESSANDO: Transação em processamento — o transactionId pode mudar.
          example: TRANSACAO_EFETIVADA
        creditDebitType:
          type: string
          description: Indicador do tipo de lançamento na conta.
          enum:
            - CREDITO
            - DEBITO
          x-enumDescriptions:
            CREDITO: Entrada de dinheiro na conta (marcado com "C" no extrato).
            DEBITO: Saída de dinheiro da conta (marcado com "D" no extrato).
          example: CREDITO
        transactionName:
          type: string
          description: >
            Literal utilizada pela instituição financeira para identificar a
            transação, idêntica à exibida nos canais digitais. Em transações com
            descrição em múltiplas linhas, todas devem ser concatenadas neste
            campo.
          example: PIX RECEBIDO - JOAO SILVA
        type:
          type: string
          description: >
            Classificação da transação. O valor `OUTROS` deve ser usado apenas
            quando a transação não se enquadrar em nenhum dos demais tipos (ex:
            pensão alimentícia).
          enum:
            - TED
            - DOC
            - PIX
            - TRANSFERENCIA_MESMA_INSTITUICAO
            - BOLETO
            - CONVENIO_ARRECADACAO
            - PACOTE_TARIFA_SERVICOS
            - TARIFA_SERVICOS_AVULSOS
            - FOLHA_PAGAMENTO
            - DEPOSITO
            - SAQUE
            - CARTAO
            - ENCARGOS_JUROS_CHEQUE_ESPECIAL
            - RENDIMENTO_APLIC_FINANCEIRA
            - PORTABILIDADE_SALARIO
            - RESGATE_APLIC_FINANCEIRA
            - OPERACAO_CREDITO
            - OUTROS
          example: PIX
        transactionAmount:
          type: object
          description: Valor da transação com no mínimo 2 e no máximo 4 casas decimais.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor monetário da transação.
              example: '1500.00'
            currency:
              type: string
              description: Moeda do valor conforme ISO-4217.
              example: BRL
        transactionDateTime:
          type: string
          format: date-time
          description: >-
            Data e hora original em que a transação foi realizada (ISO 8601,
            UTC).
          example: '2024-09-09T10:30:00Z'
        partieCnpjCpf:
          type: string
          description: >
            CPF ou CNPJ da contraparte envolvida na transação (pagador ou
            recebedor), sem formatação. Obrigatório a partir de 02/05/23 para
            transações de pagamento (IN BCB nº 371).

            **[Restrição]** Quando `type` for `FOLHA_PAGAMENTO` e a transmissora
            for o banco-folha, deve ser informado o CNPJ do empregador.
          example: '12345678909'
        partiePersonType:
          type: string
          description: Tipo de pessoa da contraparte envolvida na transação.
          enum:
            - PESSOA_NATURAL
            - PESSOA_JURIDICA
          x-enumDescriptions:
            PESSOA_NATURAL: Pessoa física — informar CPF em partieCnpjCpf.
            PESSOA_JURIDICA: Pessoa jurídica — informar CNPJ em partieCnpjCpf.
          example: PESSOA_NATURAL
        partieCompeCode:
          type: string
          description: >
            Código identificador atribuído pelo Banco Central do Brasil à
            instituição da contraparte, participante do STR (Sistema de
            Transferência de Reservas).
          example: '341'
        partieBranchCode:
          type: string
          description: Código da agência da contraparte envolvida na transação.
          example: '1234'
        partieNumber:
          type: string
          description: Número da conta da contraparte envolvida na transação.
          example: '56789'
        partieCheckDigit:
          type: string
          description: Dígito verificador da conta da contraparte envolvida na transação.
          example: '0'
    CreditCard:
      type: object
      description: Cartão de crédito (conta de pagamento pós-paga) do usuário.
      required:
        - creditCardAccountId
        - brandName
        - companyCnpj
        - name
        - productType
        - creditCardNetwork
        - details
        - bills
        - limits
      properties:
        creditCardAccountId:
          type: string
          description: >
            Identificador único e imutável da conta de pagamento pós-paga do
            cliente na instituição transmissora.
          example: 5a66d935-e8f0-4af4-a24c-9dfbfb6d2bd3
        brandName:
          type: string
          description: Nome da marca reportada pelo participante no Open Finance.
          example: Sib Bank
        companyCnpj:
          type: string
          description: >-
            CNPJ completo da instituição responsável pelo cadastro (14 dígitos,
            sem máscara).
          example: '40156018000100'
        name:
          type: string
          description: >
            Denominação/identificação do nome da conta de pagamento pós-paga
            (cartão), conforme CIRCULAR Nº 3.680 do BCB.
          example: CARTAO PLATINUM SIB
        productType:
          type: string
          description: >-
            Categoria atribuída ao cartão de pagamento conforme perfil do
            portador.
          enum:
            - CLASSIC_NACIONAL
            - CLASSIC_INTERNACIONAL
            - GOLD
            - PLATINUM
            - INFINITE
            - ELECTRON
            - STANDARD_NACIONAL
            - STANDARD_INTERNACIONAL
            - ELETRONIC
            - BLACK
            - REDESHOP
            - MAESTRO_MASTERCARD_MAESTRO
            - GREEN
            - BLUE
            - BLUEBOX
            - PROFISSIONAL_LIBERAL
            - CHEQUE_ELETRONICO
            - CORPORATIVO
            - EMPRESARIAL
            - COMPRAS
            - BASICO_NACIONAL
            - BASICO_INTERNACIONAL
            - NANQUIM
            - GRAFITE
            - MAIS
            - OUTROS
          example: PLATINUM
        productAdditionalInfo:
          type: string
          description: >
            Informações complementares sobre o tipo de cartão. Obrigatório
            quando `productType` for `OUTROS`.
          example: Cartão de benefícios corporativos
        creditCardNetwork:
          type: string
          description: Bandeira do cartão de crédito (instituidor do arranjo de pagamento).
          enum:
            - VISA
            - MASTERCARD
            - AMERICAN_EXPRESS
            - DINERS_CLUB
            - HIPERCARD
            - BANDEIRA_PROPRIA
            - CHEQUE_ELETRONICO
            - ELO
            - OUTRAS
          example: MASTERCARD
        networkAdditionalInfo:
          type: string
          description: >
            Texto livre para especificar a bandeira quando `creditCardNetwork`
            for `OUTRAS`.
          example: Bandeira regional XYZ
        details:
          $ref: '#/components/schemas/CreditCardDetails'
        bills:
          $ref: '#/components/schemas/CreditCardBill'
        limits:
          $ref: '#/components/schemas/CreditCardLimits'
    CreditCardBill:
      type: object
      description: Informações da fatura atual do cartão de crédito.
      required:
        - billId
        - dueDate
        - billTotalAmount
        - billMinimumAmount
        - isInstalment
        - payments
      properties:
        billId:
          type: string
          description: Identificador único da fatura.
          example: BILL-2024-09
        dueDate:
          type: string
          format: date
          description: Data de vencimento da fatura.
          example: '2024-09-15'
        billTotalAmount:
          type: object
          description: >
            Valor total da fatura. Positivo para saldo devedor, negativo para
            saldo credor.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: >-
                Valor total da fatura com no mínimo 2 e no máximo 4 casas
                decimais.
              example: '3250.75'
            currency:
              type: string
              description: Moeda conforme ISO-4217.
              example: BRL
        billMinimumAmount:
          type: object
          description: Valor do pagamento mínimo da fatura.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor do pagamento mínimo.
              example: '162.54'
            currency:
              type: string
              description: Moeda conforme ISO-4217.
              example: BRL
        isInstalment:
          type: boolean
          description: Indica se a fatura permite parcelamento (`true`) ou não (`false`).
          example: false
        financeCharges:
          type: array
          description: Lista de encargos cobrados na fatura.
          items:
            $ref: '#/components/schemas/BillFinanceCharge'
        payments:
          type: array
          description: Lista de pagamentos realizados na fatura.
          items:
            $ref: '#/components/schemas/BillPayment'
    BillFinanceCharge:
      type: object
      description: Encargo cobrado na fatura do cartão.
      required:
        - type
        - amount
        - currency
      properties:
        type:
          type: string
          description: Tipo de encargo incidente na fatura.
          enum:
            - JUROS_REMUNERATORIOS_ATRASO_PAGAMENTO_FATURA
            - MULTA_ATRASO_PAGAMENTO_FATURA
            - JUROS_MORA_ATRASO_PAGAMENTO_FATURA
            - IOF
            - OUTROS
          x-enumDescriptions:
            JUROS_REMUNERATORIOS_ATRASO_PAGAMENTO_FATURA: Juros remuneratórios por atraso no pagamento da fatura.
            MULTA_ATRASO_PAGAMENTO_FATURA: Multa por atraso no pagamento da fatura.
            JUROS_MORA_ATRASO_PAGAMENTO_FATURA: Juros de mora por atraso no pagamento da fatura.
            IOF: Imposto sobre Operações Financeiras.
            OUTROS: Outros encargos não listados.
          example: JUROS_REMUNERATORIOS_ATRASO_PAGAMENTO_FATURA
        additionalInfo:
          type: string
          description: |
            Campo livre. Obrigatório quando `type` for `OUTROS`.
          example: Encargo adicional específico da instituição
        amount:
          type: string
          description: >-
            Valor cobrado pelo encargo com no mínimo 2 e no máximo 4 casas
            decimais.
          example: '45.00'
        currency:
          type: string
          description: Moeda do encargo conforme ISO-4217.
          example: BRL
    BillPayment:
      type: object
      description: Pagamento realizado na fatura do cartão.
      required:
        - valueType
        - paymentDate
        - paymentMode
        - amount
        - currency
      properties:
        valueType:
          type: string
          description: Tipo do valor de pagamento da fatura.
          enum:
            - VALOR_PAGAMENTO_FATURA_PARCELADO
            - VALOR_PAGAMENTO_FATURA_REALIZADO
            - OUTRO_VALOR_PAGO_FATURA
          x-enumDescriptions:
            VALOR_PAGAMENTO_FATURA_PARCELADO: Pagamento que abre o plano de parcelamento da fatura.
            VALOR_PAGAMENTO_FATURA_REALIZADO: Pagamento correspondente ao valor total da fatura.
            OUTRO_VALOR_PAGO_FATURA: Demais casos de pagamento.
          example: VALOR_PAGAMENTO_FATURA_REALIZADO
        paymentDate:
          type: string
          format: date
          description: Data efetiva em que o pagamento da fatura foi realizado.
          example: '2024-08-15'
        paymentMode:
          type: string
          description: Forma de efetivação do pagamento.
          enum:
            - DEBITO_CONTA_CORRENTE
            - BOLETO_BANCARIO
            - AVERBACAO_FOLHA
            - PIX
          example: DEBITO_CONTA_CORRENTE
        amount:
          type: string
          description: Valor do pagamento. Não pode ser negativo.
          example: '2100.00'
        currency:
          type: string
          description: Moeda do pagamento conforme ISO-4217.
          example: BRL
    CreditCardLimits:
      type: object
      description: Limites de crédito do cartão.
      required:
        - creditLineLimitType
        - consolidationType
        - identificationNumber
        - isLimitFlexible
        - usedAmount
      properties:
        creditLineLimitType:
          type: string
          description: Tipo de limite de crédito aplicado ao cartão.
          enum:
            - LIMITE_CREDITO_TOTAL
            - LIMITE_CREDITO_MODALIDADE_OPERACAO
          x-enumDescriptions:
            LIMITE_CREDITO_TOTAL: Limite de crédito total aplicado à conta cartão.
            LIMITE_CREDITO_MODALIDADE_OPERACAO: Limite de crédito por modalidade de operação da conta cartão.
          example: LIMITE_CREDITO_TOTAL
        consolidationType:
          type: string
          description: >-
            Indica se o limite é consolidado entre todos os métodos de pagamento
            ou individual por método.
          enum:
            - CONSOLIDADO
            - INDIVIDUAL
          x-enumDescriptions:
            CONSOLIDADO: >-
              Limite compartilhado entre todos os métodos de pagamento
              vinculados à conta.
            INDIVIDUAL: Cada método de pagamento possui seu próprio limite segregado.
          example: CONSOLIDADO
        identificationNumber:
          type: string
          description: >
            Número de identificação do cartão — últimos 4 dígitos para PF, ou
            identificador definido pelo Open Finance para PJ.
          example: '1234'
        lineName:
          type: string
          description: Modalidade de crédito associada ao limite.
          enum:
            - CREDITO_A_VISTA
            - CREDITO_PARCELADO
            - SAQUE_CREDITO_BRASIL
            - SAQUE_CREDITO_EXTERIOR
            - EMPRESTIMO_CARTAO_CONSIGNADO
            - OUTROS
          example: CREDITO_A_VISTA
        lineNameAdditionalInfo:
          type: string
          description: |
            Campo livre. Obrigatório quando `lineName` for `OUTROS`.
          example: Modalidade especial de crédito
        isLimitFlexible:
          type: boolean
          description: >
            `true` — conta cartão com limite total flexível ou "sem limite".
            `false` — conta cartão com limite predeterminado exibido ao cliente.
          example: false
        limitAmount:
          type: object
          description: >
            Valor total do limite concedido. **[Restrição]** Obrigatório quando
            `isLimitFlexible` for `false`.
          properties:
            amount:
              type: string
              description: Valor total do limite.
              example: '10000.00'
            currency:
              type: string
              description: Moeda conforme ISO-4217.
              example: BRL
            limitAmountReason:
              type: string
              description: >
                Razão pela qual o valor total do limite é zero. **[Restrição]**
                Obrigatório quando `limitAmount` for igual a `0.00`.
              example: Limite temporariamente zerado por solicitação do cliente
        usedAmount:
          type: object
          description: Valor utilizado do limite.
          required:
            - amount
            - currency
          properties:
            amount:
              type: string
              description: Valor utilizado do limite.
              example: '3250.75'
            currency:
              type: string
              description: Moeda conforme ISO-4217.
              example: BRL
        availableAmount:
          type: object
          description: >
            Valor disponível do limite. **[Restrição]** Obrigatório quando
            `isLimitFlexible` for `false`.
          properties:
            amount:
              type: string
              description: Valor disponível do limite.
              example: '6749.25'
            currency:
              type: string
              description: Moeda conforme ISO-4217.
              example: BRL
        customizedLimitAmount:
          type: object
          description: >
            Valor total do limite customizado pelo cliente nos canais
            eletrônicos da instituição. Obrigatório quando a instituição
            permitir ao cliente alterar seu limite.
          properties:
            amount:
              type: string
              description: Valor total do limite customizado.
              example: '8000.00'
            currency:
              type: string
              description: Moeda conforme ISO-4217.
              example: BRL
    CreditCardDetails:
