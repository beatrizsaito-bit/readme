openapi: 3.0.3
info:
  title: DataLink API
  version: 1.0.0
  description: >
    A DataLink API fornece acesso estruturado a dados financeiros via Open
    Finance Brasil.
servers:
  - url: https://api.datalink.com.br/v1
    description: Produção
  - url: https://sandbox.datalink.com.br/v1
    description: Sandbox
security:
  - bearerAuth: []
x-tagGroups:
  - name: Dados | Recursos Principais
    tags:
      - Passo a passo para realizar um consentimento
      - Conexão Widget
      - Consentimento
      - Usuários
      - Webhooks de Notificação
      - Configuração de Webhooks
      - Eventos de Webhooks
      - Métricas
  - name: Dados | Aggregation API
    tags:
      - Dados Cadastrais
      - Contas
      - Cartões de Crédito
      - Contratos de Crédito
      - Investimentos
  - name: Dados | Intelligence API
    tags:
      - Intelligence API
      - Movimentações Mensais
      - Categorização de Gastos
      - Recomendações Personalizadas
  - name: Dados | Credit Signals API
    tags:
      - Credit Signals API
tags:
  - name: Passo a passo para realizar um consentimento
    description: Guia de integração do fluxo de consentimento Open Finance.
  - name: Conexão Widget
    description: Integração via widget embarcado para o fluxo de consentimento.
  - name: Consentimento
    description: Gerenciamento do ciclo de vida do consentimento Open Finance.
  - name: Usuários
    description: Listagem de usuários e seus consentimentos vinculados.
  - name: Webhooks de Notificação
    description: Gerenciamento de canais de notificação via webhook.
  - name: Configuração de Webhooks
    description: Criação, atualização e remoção de webhooks.
  - name: Eventos de Webhooks
    description: Consulta e reenvio de eventos de webhook.
  - name: Métricas
    description: Métricas de uso da plataforma.
  - name: Dados Cadastrais
    description: Dados cadastrais de pessoas físicas e jurídicas.
  - name: Contas
    description: Listagem e transações de contas bancárias.
  - name: Cartões de Crédito
    description: Cartões, transações e faturas.
  - name: Contratos de Crédito
    description: Contratos de crédito e pagamentos.
  - name: Investimentos
    description: Carteira de investimentos e movimentações.
  - name: Intelligence API
    description: Sinais de inteligência financeira derivados dos dados Open Finance.
  - name: Movimentações Mensais
    description: Resumos mensais de movimentações em cartões, contas e investimentos.
  - name: Categorização de Gastos
    description: Categorização e composição dos gastos por tipo de produto.
  - name: Recomendações Personalizadas
    description: Recomendações financeiras personalizadas baseadas no perfil do usuário.
  - name: Credit Signals API
    description: Análise financeira avançada para decisões de crédito e risco.
paths:
  /api/v1/organisations:
    get:
      tags:
        - Consentimento
      summary: Instituições participantes
      description: >
        Retorna a lista de instituições financeiras participantes do Open
        Finance Brasil disponíveis para iniciar um fluxo de consentimento. Cada
        instituição pode conter um ou mais servidores de autorização
        (AuthorisationServers), com informações de branding, discovery OpenID e
        os recursos de API disponíveis.
      operationId: listInstitutions
      parameters: []
      responses:
        '200':
          description: Lista de instituições retornada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Lista de instituições participantes.
                    items:
                      $ref: '#/components/schemas/Organisation'
              example:
                data:
                  - OrganisationName: BCO BMG S.A.
                    OrganisationId: 4ae2cefb-e3c1-5624-9448-b3aa4777c539
                    LegalEntityName: BANCO BMG S.A.
                    RegistrationNumber: '61186680000174'
                    ParentOrganisationReference: ''
                    AuthorisationServers:
                      - AuthorisationServerId: e70bc5a2-9b70-40f1-a3bb-7e6f41695c52
                        CustomerFriendlyName: BANCO BMG
                        CustomerFriendlyDescription: Auth Server SBX
                        CustomerFriendlyLogoUri: >-
                          https://www.bancobmg.com.br/lumis-theme/br/com/bmg/portal/theme/bmg-portal/img/logo.svg
                        OpenIDDiscoveryDocument: >-
                          https://api-openfinance-dev.bancobmg.com.br/of-auth/realms/bmg-sbx/.well-known/openid-configuration
                        Flags:
                          Suporta Contas PF:
                            - Suporta Contas PF
                          Suporta Contas PJ:
                            - Suporta Contas PJ
                        ApiResources:
                          - ApiFamilyType: consents
                            ApiVersion: 3.3.0
                            ApiDiscoveryEndpoints:
                              - >-
                                https://api-openfinance-dev-m.bancobmg.com.br/open-banking/consents/v3/consents
                              - >-
                                https://api-openfinance-dev-m.bancobmg.com.br/open-banking/consents/v3/consents/{consentId}
                            Status: Active
                          - ApiFamilyType: accounts
                            ApiVersion: 2.4.2
                            ApiDiscoveryEndpoints:
                              - >-
                                https://api-openfinance-dev-m.bancobmg.com.br/open-banking/accounts/v2/accounts
                              - >-
                                https://api-openfinance-dev-m.bancobmg.com.br/open-banking/accounts/v2/accounts/{accountId}/transactions
                            Status: Active
  /api/v1/consents:
    post:
      tags:
        - Consentimento
      summary: Criar consentimento
      description: >
        Inicia o fluxo de criação de um consentimento Open Finance para um
        usuário final (pessoa física ou jurídica). Retorna uma URL de
        redirecionamento para que o usuário autorize o acesso aos dados na
        instituição financeira selecionada.
      operationId: createConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRequest'
            examples:
              pessoa_fisica:
                summary: Pessoa Física (PF)
                value:
                  organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                  authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                  consent:
                    loggedUser:
                      cpf: '12345678909'
                    permissions:
                      - RESOURCES_READ
                      - CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ
                      - CUSTOMERS_PERSONAL_ADITTIONALINFO_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_OVERDRAFT_LIMITS_READ
                      - ACCOUNTS_TRANSACTIONS_READ
                      - CREDIT_CARDS_ACCOUNTS_READ
                      - CREDIT_CARDS_ACCOUNTS_LIMITS_READ
                      - CREDIT_CARDS_ACCOUNTS_TRANSACTIONS_READ
                      - CREDIT_CARDS_ACCOUNTS_BILLS_READ
                      - CREDIT_CARDS_ACCOUNTS_BILLS_TRANSACTIONS_READ
                      - LOANS_READ
                      - LOANS_WARRANTIES_READ
                      - LOANS_SCHEDULED_INSTALMENTS_READ
                      - LOANS_PAYMENTS_READ
                      - BANK_FIXED_INCOMES_READ
                      - FUNDS_READ
                      - VARIABLE_INCOMES_READ
                      - TREASURE_TITLES_READ
              pessoa_juridica:
                summary: Pessoa Jurídica (PJ)
                value:
                  organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                  authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                  consent:
                    loggedUser:
                      cnpj: '11222333000181'
                    permissions:
                      - RESOURCES_READ
                      - CUSTOMERS_BUSINESS_IDENTIFICATIONS_READ
                      - CUSTOMERS_BUSINESS_ADITTIONALINFO_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_TRANSACTIONS_READ
      responses:
        '200':
          description: Consentimento criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
              example:
                consentId: >-
                  urn:datalink:74e929d9-33b6-4d85-8ba7-c146c867a817:3fa85f64-5717-4562-b3fc-2c963f66afa6
                status: AWAITING_AUTHORISATION
                redirectUrl: >-
                  https://auth.bancobmg.com.br/of-auth/realms/bmg/protocol/openid-connect/auth?client_id=datalink&redirect_uri=https%3A%2F%2Fcallback.datalink.com.br&response_type=code&scope=openid
                creationDateTime: '2026-05-20T10:30:00Z'
                expirationDateTime: '2026-05-20T10:45:00Z'
                permissions:
                  - RESOURCES_READ
                  - CUSTOMERS_PERSONAL_IDENTIFICATIONS_READ
                  - ACCOUNTS_READ
                  - ACCOUNTS_BALANCES_READ
                  - ACCOUNTS_TRANSACTIONS_READ
        '400':
          description: >-
            Requisição inválida. Verifique os campos obrigatórios e o formato
            dos dados.
        '401':
          description: Não autorizado. Token ausente ou inválido.
        '422':
          description: >-
            Entidade não processável. A instituição ou servidor de autorização
            informado não foi encontrado.
    get:
      tags:
        - Consentimento
      summary: Listar todos os consentimentos
      description: >
        Retorna todos os consentimentos criados pela organização, com suporte a
        filtros por status e busca por CPF/CNPJ, além de paginação e ordenação.
      operationId: listConsents
      parameters:
        - name: page
          in: query
          required: false
          description: Número da página para paginação dos resultados.
          schema:
            type: integer
            example: 1
        - name: limit
          in: query
          required: false
          description: Quantidade de registros retornados por página.
          schema:
            type: integer
            example: 20
        - name: sortBy
          in: query
          required: false
          description: Campo utilizado para ordenação dos resultados.
          schema:
            type: string
            example: creationDateTime
        - name: sortOrder
          in: query
          required: false
          description: Direção da ordenação dos resultados.
          schema:
            type: string
            enum:
              - asc
              - desc
            example: desc
        - name: status
          in: query
          required: false
          description: Filtra os consentimentos pelo status atual.
          schema:
            type: string
            enum:
              - AUTHORISED
              - AWAITING_AUTHORISATION
              - REJECTED
              - REVOKED
            example: AUTHORISED
        - name: search
          in: query
          required: false
          description: >
            Busca por documento do usuário. Aceita CPF (11 dígitos) ou CNPJ (14
            dígitos), somente números.
          schema:
            type: string
            pattern: ^(\d{11}|\d{14})$
            example: '12345678909'
      responses:
        '200':
          description: Lista de consentimentos retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentListResponse'
              example:
                data:
                  - consentId: >-
                      urn:datalink:74e929d9-33b6-4d85-8ba7-c146c867a817:3fa85f64-5717-4562-b3fc-2c963f66afa6
                    status: AUTHORISED
                    creationDateTime: '2026-05-18T09:00:00Z'
                    expirationDateTime: '2027-05-18T09:00:00Z'
                    permissions:
                      - RESOURCES_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_TRANSACTIONS_READ
                    loggedUser:
                      cpf: '12345678909'
                  - consentId: >-
                      urn:datalink:74e929d9-33b6-4d85-8ba7-c146c867a817:7cb12a30-1234-4abc-a001-9f3e2d1c4b5a
                    status: AWAITING_AUTHORISATION
                    creationDateTime: '2026-05-20T10:30:00Z'
                    expirationDateTime: '2026-05-20T10:45:00Z'
                    permissions:
                      - RESOURCES_READ
                      - CUSTOMERS_BUSINESS_IDENTIFICATIONS_READ
                      - ACCOUNTS_READ
                    loggedUser:
                      cnpj: '11222333000181'
                pagination:
                  page: 1
                  limit: 20
                  total: 2
                  totalPages: 1
        '401':
          description: Não autorizado. Token ausente ou inválido.
  /api/v1/users/{user_id}/consents/{consent_id}:
    get:
      tags:
        - Consentimento
      summary: Recuperar consentimento
      description: >
        Retorna os detalhes completos de um consentimento específico vinculado a
        um usuário, incluindo status atual, permissões concedidas e, quando
        aplicável, informações de rejeição.
      operationId: getConsent
      parameters:
        - name: user_id
          in: path
          required: true
          description: Identificador único do usuário na plataforma DataLink.
          schema:
            type: string
            format: uuid
            example: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
        - name: consent_id
          in: path
          required: true
          description: >
            Identificador único do consentimento no formato URN, conforme RFC
            8141.
          schema:
            type: string
            pattern: >-
              ^urn:[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*'%\/?#]+$
            example: urn:raidiambank:23f1a40c-6c9e-4c76-998c-d33d7c546818
      responses:
        '200':
          description: Consentimento retornado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserConsent'
              example:
                data:
                  userId: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
                  consentId: urn:raidiambank:23f1a40c-6c9e-4c76-998c-d33d7c546818
                  creationDateTime: '2025-02-14T11:28:11Z'
                  status: REJECTED
                  statusUpdateDateTime: '2025-02-14T11:29:41Z'
                  permissions:
                    - RESOURCES_READ
                    - ACCOUNTS_READ
                    - ACCOUNTS_BALANCES_READ
                    - ACCOUNTS_TRANSACTIONS_READ
                  expirationDateTime: '2027-02-14T11:28:11Z'
                  organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                  authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                  rejection:
                    rejectedBy: USER
                    reason:
                      code: CUSTOMER_MANUALLY_REVOKED
                      additionalInformation: Tempo de confirmação da múltipla alçada excedido.
        '401':
          description: Não autorizado. Token ausente ou inválido.
        '404':
          description: Consentimento não encontrado para o usuário informado.
    delete:
      tags:
        - Consentimento
      summary: Revogar consentimento
      description: >
        Revoga um consentimento ativo, encerrando imediatamente o acesso aos
        dados do usuário pela plataforma DataLink.
      operationId: revokeConsent
      parameters:
        - name: user_id
          in: path
          required: true
          description: Identificador único do usuário na plataforma DataLink.
          schema:
            type: string
            format: uuid
            example: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
        - name: consent_id
          in: path
          required: true
          description: >-
            Identificador único do consentimento no formato URN, conforme RFC
            8141.
          schema:
            type: string
            example: urn:raidiambank:23f1a40c-6c9e-4c76-998c-d33d7c546818
      responses:
        '200':
          description: Consentimento revogado com sucesso.
        '401':
          description: Não autorizado. Token ausente ou inválido.
        '404':
          description: Consentimento não encontrado para o usuário informado.
  /users:
    get:
      tags:
        - Usuários
      summary: Listar todos os usuários
      description: ''
      operationId: listUsers
      parameters: []
      responses:
        '200':
          description: ''
  /api/v1/users/{user_id}/consents:
    get:
      tags:
        - Usuários
      summary: Listar todos os consentimentos de usuário
      description: >
        Retorna todos os consentimentos vinculados a um usuário específico,
        incluindo o status atual, permissões concedidas e, quando aplicável, os
        detalhes de rejeição conforme especificação Open Finance Brasil.
      operationId: listUserConsents
      parameters:
        - name: user_id
          in: path
          required: true
          description: Identificador único do usuário na plataforma DataLink.
          schema:
            type: string
            format: uuid
            example: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
      responses:
        '200':
          description: Lista de consentimentos do usuário retornada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Lista de consentimentos do usuário.
                    items:
                      $ref: '#/components/schemas/UserConsent'
              example:
                data:
                  - userId: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
                    consentId: urn:raidiambank:23f1a40c-6c9e-4c76-998c-d33d7c546818
                    creationDateTime: '2025-02-14T11:28:11Z'
                    status: REJECTED
                    statusUpdateDateTime: '2025-02-14T11:29:41Z'
                    permissions:
                      - RESOURCES_READ
                      - ACCOUNTS_READ
                    organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
                    rejection:
                      rejectedBy: USER
                      reason:
                        code: CUSTOMER_MANUALLY_REVOKED
                  - userId: 9d9fe35d-8e12-46f3-807c-4bdaa1238d32
                    consentId: urn:raidiambank:2d076b0d-7b01-4822-9147-9303120eb1d3
                    creationDateTime: '2025-02-10T20:06:44Z'
                    status: AUTHORISED
                    statusUpdateDateTime: '2025-02-10T20:07:23Z'
                    permissions:
                      - RESOURCES_READ
                      - ACCOUNTS_READ
                      - ACCOUNTS_BALANCES_READ
                      - ACCOUNTS_TRANSACTIONS_READ
                    organisationId: 74e929d9-33b6-4d85-8ba7-c146c867a817
                    authorisationServerId: c8f0bf49-4744-4933-8960-7add6e590841
        '401':
          description: Não autorizado. Token ausente ou inválido.
        '404':
          description: Usuário não encontrado.
  /api/v1/notification/{tenant_id}:
    get:
      tags:
        - Webhooks de Notificação
      summary: Buscar canais
      description: >
        Retorna os canais de notificação configurados para o tenant, incluindo
        webhooks, Slack, e-mail e SMS.
      operationId: getNotificationChannels
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: Identificador único do tenant na plataforma.
          schema:
            type: string
            example: alex-teste
      responses:
        '200':
          description: Canais de notificação retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelsResponse'
              examples:
                OK:
                  summary: OK
                  value:
                    tenantId: tenant_id
                    channels:
                      - type: webhook
                        value: exemplo
                        enable: true
                        secret: null
                      - type: slack
                        value: exemploURL2
                        enable: true
                      - type: email
                        value: exemploEmail2
                        enable: true
                      - type: sms
                        value: '551234567'
                        enable: true
                    createdAt: '2025-03-20T19:22:17.646Z'
                    updatedAt: '2025-03-20T20:12:11.715Z'
        '401':
          description: Não autorizado. Token ausente ou inválido.
    post:
      tags:
        - Webhooks de Notificação
      summary: Criar canais
      description: |
        Cria a configuração inicial de canais de notificação para um tenant.
      operationId: createNotificationChannel
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: Identificador único do tenant na plataforma.
          schema:
            type: string
            example: alex-teste
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannelsRequest'
      responses:
        '200':
          description: Canais criados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelsResponse'
        '400':
          description: Requisição inválida.
        '401':
          description: Não autorizado. Token ausente ou inválido.
    patch:
      tags:
        - Webhooks de Notificação
      summary: Atualizar canais
      description: >
        Atualiza os canais de notificação de um tenant. Permite adicionar,
        alterar ou desabilitar canais existentes.
      operationId: updateNotificationChannel
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: Identificador único do tenant na plataforma.
          schema:
            type: string
            example: alex-teste
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannelsRequest'
            examples:
              New Example:
                summary: Atualizar múltiplos canais
                value:
                  tenantId: alex-teste
                  channels:
                    - type: webhook
                      value: exemplo
                      enable: true
                      secret: null
                    - type: slack
                      value: exemploURL2
                      enable: true
                    - type: email
                      value: exemploEmail2
                      enable: true
                    - type: sms
                      value: '551234567'
                      enable: true
      responses:
        '200':
          description: Canais atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannelsResponse'
              examples:
                OK:
                  summary: OK
                  value:
                    tenantId: tenant_id
                    channels:
                      - type: webhook
                        value: exemplo
                        enable: true
                        secret: null
                      - type: slack
                        value: exemploURL2
                        enable: true
                      - type: email
                        value: exemploEmail2
                        enable: true
                      - type: sms
                        value: '551234567'
                        enable: true
                    createdAt: '2025-03-20T19:22:17.646Z'
                    updatedAt: '2025-03-20T20:12:11.715Z'
        '401':
          description: Não autorizado. Token ausente ou inválido.
  /api/v1/notification/{tenant_id}/webhooks:
    get:
      tags:
        - Configuração de Webhooks
      summary: Listar seus webhooks
      description: >
        Retorna todos os webhooks configurados para o tenant, incluindo status,
        secret e histórico de falhas consecutivas.
      operationId: listWebhooks
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: Identificador único do tenant na plataforma.
          schema:
            type: string
            example: go-assets
      responses:
        '200':
          description: Webhooks retornados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookConfig'
              examples:
                OK:
                  summary: OK
                  value:
                    webhooks:
                      - clientId: go-assets-prod
                        value: https://prod.empresa.com/webhooks/lina
                        enable: true
                        secret: 88bccb89-0674-4e2e-a4f7-2ea2bf3fb2e2
                        consecutiveFailures: 0
                      - clientId: go-assets-hml
                        value: https://hml.empresa.com/webhooks/lina
                        enable: false
                        secret: aad157c8-0111-470a-94df-e86b6afa282b
                        consecutiveFailures: 0
        '401':
          description: Não autorizado. Token ausente ou inválido.
  /api/v1/notification/{tenant_id}/webhooks/{client_id}:
    put:
      tags:
        - Configuração de Webhooks
      summary: Criar ou atualizar webhook
      description: >
        Cria um novo webhook ou atualiza o endpoint de um webhook existente para
        o `client_id` informado.
      operationId: upsertWebhook
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: Identificador único do tenant na plataforma.
          schema:
            type: string
            example: go-assets
        - name: client_id
          in: path
          required: true
          description: Client ID Keycloak associado ao webhook.
          schema:
            type: string
            example: go-assets-prod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpsertRequest'
            examples:
              Request Example:
                summary: Criar ou atualizar webhook
                value:
                  value: https://prod.empresa.com/webhooks/lina
                  enable: true
      responses:
        '200':
          description: Webhook criado ou atualizado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Webhook updated
              examples:
                OK:
                  summary: OK
                  value:
                    message: Webhook updated
        '400':
          description: Body inválido.
          content:
            application/json:
              example:
                message: Body inválido
        '401':
          description: Não autorizado. Token ausente ou inválido.
    delete:
      tags:
        - Configuração de Webhooks
      summary: Remover webhook
      description: |
        Remove permanentemente o webhook associado ao `client_id` informado.
      operationId: deleteWebhook
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: Identificador único do tenant na plataforma.
          schema:
            type: string
            example: go-assets
        - name: client_id
          in: path
          required: true
          description: Client ID Keycloak associado ao webhook.
          schema:
            type: string
            example: go-assets-prod
      responses:
        '204':
          description: Webhook removido com sucesso. Sem conteúdo na resposta.
        '401':
          description: Não autorizado. Token ausente ou inválido.
        '404':
          description: Webhook não encontrado.
  /api/v1/notification/{tenant_id}/webhooks/{client_id}/rotate-secret:
    post:
      tags:
        - Configuração de Webhooks
      summary: Rotacionar secret do webhook
      description: >
        Gera um novo secret para o webhook. O secret anterior permanece válido
        por 24 horas para garantir a transição sem interrupção na verificação de
        assinatura `X-Lina-Signature`.
      operationId: rotateWebhookSecret
      parameters:
        - name: tenant_id
          in: path
          required: true
          description: Identificador único do tenant na plataforma.
          schema:
            type: string
            example: go-assets
        - name: client_id
          in: path
          required: true
          description: Client ID Keycloak associado ao webhook.
          schema:
            type: string
            example: go-assets-prod
      responses:
        '200':
          description: Secret rotacionado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: >-
                      Novo secret gerado para validação da assinatura
                      X-Lina-Signature.
                    example: >-
                      whsec_a3f8b2c1d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
              examples:
                OK:
                  summary: OK
                  value:
                    secret: >-
